name: Auto-merge

# Trusted main tooling checks the actual app diff and merge result, then fast-forwards main.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: console-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && ((github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'console/'))
           || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
      || (github.event_name == 'pull_request' && github.event.label.name == 'auto-merge'
          && startsWith(github.event.pull_request.head.ref, 'console/'))
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies and flux-schema
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check
          curl -fsSLo "$RUNNER_TEMP/flux-schema.tar.gz" \
            https://github.com/fluxcd/flux-schema/releases/download/v0.9.0/flux-schema_0.9.0_linux_amd64.tar.gz
          echo "104b764a53bcec30ec856a6a3efaecd13abf606099f0b057932027d755313cdb  $RUNNER_TEMP/flux-schema.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux-schema.tar.gz" -C "$RUNNER_TEMP/bin" flux-schema
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Cache checksum-verified OTel collectors
        uses: actions/cache@v4
        with:
          path: ~/.cache/swhurl-platform/otelcol
          key: otelcol-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/otel/helmrelease-*.yaml') }}
          restore-keys: |
            otelcol-${{ runner.os }}-${{ runner.arch }}-

      - name: Merge eligible console PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_HELM: '1'
        run: PYTHONPATH=tools uv run --frozen python -m swhurl console-merge
