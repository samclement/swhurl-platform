name: Auto-merge

# Merges a console pull request labelled `auto-merge` once Validate has passed on its current commit.
# The console labels only changes that are easy to undo (docs/console.md#auto-merge); this workflow checks
# again that the PR is the console's (a console/* branch in this repository), touches only app files and
# adds no encrypted file. Merges made with GITHUB_TOKEN start no workflows; Flux's webhook still sees the push.

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
       && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'console/'))
      || (github.event_name == 'pull_request' && github.event.label.name == 'auto-merge'
          && startsWith(github.event.pull_request.head.ref, 'console/'))
    steps:
      - name: Merge if it qualifies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          skip() { echo "Not merging #${PR}: $1"; exit 0; }
          [ -n "$PR" ] || skip 'no pull request in this repository'
          pr=$(gh pr view "$PR" --json state,isCrossRepository,headRefName,headRefOid,labels)
          [ "$(jq -r .state <<<"$pr")" = OPEN ] || skip 'not open'
          [ "$(jq -r .isCrossRepository <<<"$pr")" = false ] || skip 'from another repository'
          [[ "$(jq -r .headRefName <<<"$pr")" == console/* ]] || skip 'not a console branch'
          jq -e '.labels | map(.name) | index("auto-merge")' <<<"$pr" >/dev/null || skip 'no auto-merge label'
          [ "$(jq -r .headRefOid <<<"$pr")" = "$SHA" ] || skip 'the branch has moved on since this commit'
          passed=$(gh run list --workflow validate.yml --commit "$SHA" --event pull_request --status success --json databaseId --jq length)
          [ "$passed" -gt 0 ] || skip 'Validate has not passed on this commit yet'
          files=$(gh pr diff "$PR" --name-only)
          echo "$files"
          ! grep -q '\.sops\.yaml$' <<<"$files" || skip 'it changes an encrypted file'
          ! grep -qvE '^(apps/[a-z0-9-]+/(staging|prod)/|clusters/home/app-[a-z0-9-]+\.yaml$|clusters/home/kustomization\.yaml$)' <<<"$files" \
            || skip 'it changes files outside apps/<app>/<env>/ and the app units in clusters/home/'
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$SHA"
