name: Deploy

# Brings each staging app to its newest image, with what that image needs and offers, in one commit
# (make app-deploy; docs/apps.md#deploy-a-new-image). For each staging instance with an ImagePolicy:
# the newest tag the policy accepts and its digest, read from GHCR with the policy's own filter, and
# at the image's commit its swhurl.yaml: the needs written into the release (port, health path, uid,
# telemetry, minimum resources) and the API, event and flag documents it names.
#
# Flux starts it: when an app's ImagePolicy picks a new image, the image-dispatch Alert sends a
# repository_dispatch here (platform/image-automation/dispatch.yaml). The hourly run and a manual
# run catch a lost dispatch. A push does not start it, so reverting a pin holds until the next run.
#
# The commit is pushed with GITHUB_TOKEN, which starts no workflows (so not this one again, and not
# Validate): repository and app-policy checks therefore run here before pushing. An image whose needs or offers
# the platform cannot use, or which drops an event another app still receives, fails this run and is
# held: that app keeps its image and what it had; the others still deploy. A manual run with refresh
# reads the images staging already runs again.
#
# Runs may overlap (no concurrency group: a waiting run must never be replaced by one that ends
# early). Each reads main afresh, and one whose push loses to another's reads and deploys again.

on:
  repository_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Read swhurl.yaml again for images staging already runs
        type: boolean
        default: false

permissions:
  contents: write   # push the commit to main

jobs:
  deploy:
    name: Deploy the newest staging images
    runs-on: ubuntu-latest
    env:
      SOPS_VERSION: v3.12.1   # the same release and checksum as the console image
      SOPS_SHA256: cf3136d20a6004405c986a48e179c3c7a731f777fbf105a37bd5dac5c9047100
    steps:
      # An ImagePolicy reports its newest image at every reconcile, not only when it changes, and the
      # image webhook makes every policy reconcile: most dispatches name an image staging already runs.
      # Those end here, after one read of the release on main and before any setup.
      - name: Is the image new
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          POLICY: ${{ github.event.client_payload.involvedObject.name }}
          MESSAGE: ${{ github.event.client_payload.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT" != repository_dispatch ]; then echo deploy=true >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$POLICY: $MESSAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          app=${POLICY%-staging}
          wanted=$(sed -nE 's/^Latest image tag for [^ ]+ resolved to ([^ ]+) with digest (sha256:[0-9a-f]{64}).*/\1 \2/p' <<< "$MESSAGE")
          if ! [[ "$POLICY" =~ ^[a-z0-9-]+-staging$ && -n "$wanted" ]]; then
            echo "Not an image this workflow reads: deploying everything." | tee -a "$GITHUB_STEP_SUMMARY"
            echo deploy=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          running=$(gh api -H 'Accept: application/vnd.github.raw+json' \
                      "repos/$GITHUB_REPOSITORY/contents/apps/$app/staging/helmrelease.yaml?ref=main" \
                    | sed -nE 's/^ +(tag|digest): ([^ ]+).*/\2/p' | paste -sd' ' -) || running=''
          if [ "$running" = "$wanted" ]; then
            echo "Staging already runs it." | tee -a "$GITHUB_STEP_SUMMARY"
            echo deploy=false >> "$GITHUB_OUTPUT"
          else
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi

      - if: steps.compare.outputs.deploy == 'true'
        name: Checkout
        uses: actions/checkout@v4

      - if: steps.compare.outputs.deploy == 'true'
        name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - if: steps.compare.outputs.deploy == 'true'
        name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - if: steps.compare.outputs.deploy == 'true'
        name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - if: steps.compare.outputs.deploy == 'true'
        name: Install flux-schema
        run: |
          set -Eeuo pipefail
          curl -fsSLo "$RUNNER_TEMP/flux-schema.tar.gz" \
            https://github.com/fluxcd/flux-schema/releases/download/v0.9.0/flux-schema_0.9.0_linux_amd64.tar.gz
          echo "104b764a53bcec30ec856a6a3efaecd13abf606099f0b057932027d755313cdb  $RUNNER_TEMP/flux-schema.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux-schema.tar.gz" -C "$RUNNER_TEMP/bin" flux-schema
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: steps.compare.outputs.deploy == 'true'
        name: Install validation dependencies
        run: python3 -m pip install --group check

      # An app that describes events for the first time gets its NATS key, encrypted with SOPS (public
      # recipients only: no key is needed). Kept between runs; the checksum is checked every time.
      - if: steps.compare.outputs.deploy == 'true'
        id: sops
        name: Restore sops
        uses: actions/cache@v4
        with:
          path: ~/.cache/sops
          key: sops-${{ env.SOPS_VERSION }}-${{ env.SOPS_SHA256 }}

      - if: steps.compare.outputs.deploy == 'true'
        name: Install sops
        env:
          CACHED: ${{ steps.sops.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.cache/sops
          if [ "$CACHED" != true ]; then
            curl -fsSLo ~/.cache/sops/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          fi
          echo "${SOPS_SHA256}  $HOME/.cache/sops/sops" | sha256sum -c -
          chmod 0755 ~/.cache/sops/sops
          echo "$HOME/.cache/sops" >> "$GITHUB_PATH"

      - if: steps.compare.outputs.deploy == 'true'
        name: Deploy, check and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # reads the app repositories (a higher rate limit than anonymous)
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -Eeuo pipefail
          # The console and operators also push to main: start from its head, and start again if it moved.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            git reset --quiet --hard origin/main
            git clean --quiet -fd apps platform
            failed=0
            PYTHONPATH=tools python3 -m swhurl app-deploy $REFRESH > deployed.txt 2>&1 || failed=1
            tee -a "$GITHUB_STEP_SUMMARY" < deployed.txt
            if [ -z "$(git status --porcelain -- apps platform clusters)" ]; then
              echo "Nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
              exit "$failed"
            fi
            make --no-print-directory -j2 --output-sync=target check-repo check-apps
            moved=$(sed -n 's|^\[OK\] \([a-z0-9-]*\)/staging: image .*|\1|p' deployed.txt | paste -sd, - | sed 's/,/, /g')
            git add apps platform/nats/users.yaml platform/reloader/helmrelease.yaml clusters/home
            git commit --quiet -F - <<EOF
          deploy: ${moved:-what the staging apps need and offer} (deploy workflow)

          $(grep -E '^\[OK\] [a-z0-9-]+/staging(: image | needs: )' deployed.txt || true)
          EOF
            if git push --quiet origin HEAD:main; then
              git show --stat --format='%h %s' HEAD | tee -a "$GITHUB_STEP_SUMMARY"
              exit "$failed"
            fi
            echo "main moved; deploying again (attempt $attempt)"
          done
          echo "main kept moving; the next image or the hourly run deploys again" >&2
          exit 1
