name: Publish console image

# After Validate passes on main (or by hand), build images/console and push it to
# ghcr.io/samclement/swhurl-console, tagged with the commit SHA and with a hash of
# everything the image is built from. If that content hash is already published,
# nothing is built: commits that change only docs or manifests publish nothing.
# Then it deploys: on the latest main it pins platform/console/helmrelease.yaml to
# that image and pushes the commit (swhurl console-image --expect --commit), unless
# main has since moved to other image inputs, whose own run pins them. Pushes made
# with GITHUB_TOKEN start no workflows, so the pin commit triggers neither run.

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the pin commit to main
  packages: write

env:
  IMAGE: ghcr.io/samclement/swhurl-console

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # the pin commit may need a rebase onto a newer main

      - name: Hash what the image is built from
        id: source
        run: |
          set -Eeuo pipefail
          paths=(images/console .dockerignore pyproject.toml uv.lock tools
                 clusters/home/flux-system/sources/configmap-platform-settings.yaml)
          content=$(for p in "${paths[@]}"; do git rev-parse "HEAD:$p"; done | sha256sum | cut -c1-16)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this content is already published
        id: existing
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:src-${{ steps.source.outputs.content }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Image for content ${{ steps.source.outputs.content }} already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/console/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ steps.source.outputs.revision }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.revision }}
            ${{ env.IMAGE }}:src-${{ steps.source.outputs.content }}

      - name: Record the digest
        if: steps.existing.outputs.published == 'false'
        run: |
          {
            echo "### Published"
            echo
            echo "- image: \`$IMAGE:${{ steps.source.outputs.revision }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- content: \`src-${{ steps.source.outputs.content }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin the console on main (deploys it)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet --upgrade 'pip>=25.1'
          python3 -m pip install --quiet --group check
          git fetch --quiet origin main
          git checkout --quiet --detach origin/main
          PYTHONPATH=tools python3 -m swhurl console-image \
            --expect "src-${{ steps.source.outputs.content }}" --commit | tee -a "$GITHUB_STEP_SUMMARY"
