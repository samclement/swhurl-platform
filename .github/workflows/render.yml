name: Render

# Keeps main rendered from its records (docs/architecture.md#how-changes-reach-the-cluster). Every file
# under apps/ other than an app's input records (app.yaml, release.yaml, instance.yaml, offers/, the
# encrypted files), and the shared files derived from every instance, is rendered from those records by
# make app-sync. A held console pull request carries only records; when you merge it on GitHub, this
# workflow renders the newest main, checks it with make check-repo and make check-apps, and pushes the
# rendered files as one commit. A push that is already rendered (the console's gate, the Deploy
# workflow, make app-* commands) leaves nothing to do, and the run writes nothing.
#
# The commit is pushed with GITHUB_TOKEN, which starts no workflows (so not this one again, and not
# Validate): the checks run here before pushing. Flux's webhook still applies it. app-sync makes a NATS
# identity only when both its public allocation and encrypted seed are absent; a partial pair refuses,
# never rotates. This workflow has no sops: missing identities fail before any writes. A complete
# records-only pull request carries its identity and needs no encryption here or in Validate.
#
# One run at a time; a newer pending run replaces an older one, since each renders the newest main. A
# push lost to another writer reads main again and renders again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the rendered commit to main

concurrency:
  group: render-main
  cancel-in-progress: false

jobs:
  render:
    name: Render main from its records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # the commit may need to be made again on a newer main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: python3 -m pip install --group check

      # v2's render writes the resolution, every compiled folder and unit, the egress allocation and the proxy's
      # objects, platform/auth, the NATS user list and Reloader's watch list from the records.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod

      # Most pushes are already rendered: those end here, before the check tools are installed.
      - name: Is anything to render
        id: plan
        run: |
          set -Eeuo pipefail
          make -s v2-render
          if [ -z "$(git status --porcelain -- apps platform clusters v2-apps v2-records)" ]; then
            echo "main is rendered; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo render=false >> "$GITHUB_OUTPUT"
          else
            git status --short -- apps platform clusters v2-apps v2-records
            echo render=true >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.render == 'true'
        name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - if: steps.plan.outputs.render == 'true'
        name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - if: steps.plan.outputs.render == 'true'
        name: Install flux-schema
        run: |
          set -Eeuo pipefail
          curl -fsSLo "$RUNNER_TEMP/flux-schema.tar.gz" \
            https://github.com/fluxcd/flux-schema/releases/download/v0.9.0/flux-schema_0.9.0_linux_amd64.tar.gz
          echo "104b764a53bcec30ec856a6a3efaecd13abf606099f0b057932027d755313cdb  $RUNNER_TEMP/flux-schema.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux-schema.tar.gz" -C "$RUNNER_TEMP/bin" flux-schema
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: steps.plan.outputs.render == 'true'
        name: Render, check and commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # tools/swhurl/bots.py: a fresh worktree of the newest main, v2's render, checks, one commit, a
        # non-forced push; a push lost to another writer renders again on the newer main.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=tools python3 -m swhurl bot-render | tee -a "$GITHUB_STEP_SUMMARY"
