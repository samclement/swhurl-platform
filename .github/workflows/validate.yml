name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install -r requirements-validation.txt
          go install github.com/fluxcd/flux-schema/cmd/flux-schema@v0.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate active manifests and scripts
        run: make validate-repo

      - name: Run operator dry runs
        run: |
          set -Eeuo pipefail
          ./host/dynamic-dns.sh --dry-run
          make install DRY_RUN=true
          make teardown DRY_RUN=true
          make platform-certs-staging DRY_RUN=true
          make platform-certs-prod DRY_RUN=true
          make help
