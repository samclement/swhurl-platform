name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      records_only: ${{ steps.classify.outputs.records_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change of only input records (a held console PR, or one merged on GitHub) is checked rendered, as the
      # Render workflow will push it; anything else, or an unreadable push range, is checked as committed.
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          range="$BEFORE $AFTER"
          if [[ "$EVENT_NAME" == pull_request ]]; then range="$BASE_SHA...$HEAD_SHA"; fi
          records=false
          # shellcheck disable=SC2086 # the range is one or two revisions
          if git diff --name-only -z $range > "$RUNNER_TEMP/paths" 2>/dev/null; then
            records=$(bash .github/records-only.sh < "$RUNNER_TEMP/paths")
          fi
          echo "records_only=$records" | tee -a "$GITHUB_OUTPUT"

  validate:
    name: Tooling tests, lint and dry runs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make check-docs checks the workstream pages' cited commits for reachability

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: v2/go.sum

      - name: Download pinned v2 dependencies
        run: make v2-deps

      # The workstream record against this checkout's Git (swhurl-v2 workstreams); the full history above lets it
      # check that every cited commit is reachable. It runs before any step that may write into the checkout (the
      # records render below), so it sees the tree as committed.
      - name: Check the workstream record
        run: make check-docs

      - name: Lint Python tooling
        run: pipx run ruff==0.16.9 check tests devtools

      - name: Lint remaining bash
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck -x $(git ls-files '*.sh')

      - name: Test operator safety, app contract and dry runs
        env:
          REQUIRE_HELM: '1'
        run: make test

      - name: Test the code graph development aid
        run: make check-codegraph

      # The tests also check that the repository renders as committed (a records-only push: see repo).
      - name: Render the records
        if: needs.changes.outputs.records_only == 'true'
        run: make -s v2-render

      - name: Fetch the chart v2 compiles for
        run: bash v2/chart.sh

      # v2's mint encrypts through sops and its adapter contract runs the real command, which the runner image
      # does not carry. The release is pinned and checked against its published checksum before it is used.
      - name: Install sops for v2's encryption contract
        env:
          SOPS_VERSION: '3.12.1'
          SOPS_SHA256: cf3136d20a6004405c986a48e179c3c7a731f777fbf105a37bd5dac5c9047100
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/sops"
          mkdir -p "$dir"
          curl -sSL -o "$dir/sops" "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          (cd "$dir" && echo "${SOPS_SHA256}  sops" | sha256sum --check --strict)
          chmod +x "$dir/sops"
          echo "$dir" >> "$GITHUB_PATH"

      # check-v2 also renders platform/egress, platform/auth, platform/nats and platform/reloader from the records
      # and diffs them (v2/check-rendered.sh).
      - name: Check v2 and its design rules
        env:
          REQUIRE_HELM: '1'
          REQUIRE_SOPS: '1'
        run: make check-v2

      # The backup image's Go tool is its own module (images/backup/tool): dependencies, no make target the
      # command catalogue would have to document.
      - name: Check the backup image's Go tool
        run: |
          cd images/backup/tool
          export GOTOOLCHAIN=go1.26.0 CGO_ENABLED=0
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

      # The dry runs are not listed here: make test runs every target whose DRY_RUN=true only plans
      # (the Makefile's ## lines say which).
      - name: Render the lifecycle test fixture
        run: kubectl kustomize tests/fixtures/lifecycle-app >/dev/null

  repo:
    name: Validate manifests, schemas and documentation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: v2/go.sum

      - name: Download pinned v2 dependencies
        run: make v2-deps

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check

      # A records-only change is checked as main will hold it once rendered (the Render workflow).
      - name: Render the records
        if: needs.changes.outputs.records_only == 'true'
        run: make -s v2-render

      - name: Validate active manifests and scripts
        run: make check-repo

  apps:
    name: Check app instances against policy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      # check-apps compiles every v2 record and compares it with v2-apps (v2/check-rendered.sh).
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: v2/go.sum

      - name: Download pinned v2 dependencies
        run: make v2-deps

      - name: Install validation dependencies
        run: python3 -m pip install --group check

      - name: Render the records
        if: needs.changes.outputs.records_only == 'true'
        run: make -s v2-render

      - name: Check app instances against policy
        run: make check-apps

  templates:
    name: Check every app type against the templates
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copier, the one Python tool left on this path, runs through uvx (v2/check-templates.sh); git and jq are the
      # runner's.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The check runs the names check, the producer and v2's own creation rules, so it needs the binary.
      - uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: v2/go.sum

      - name: Download pinned v2 dependencies
        run: make v2-deps

      - name: Check every stack template combination against the app contract
        env:
          SWHURL_V2: /tmp/swhurl-v2
        run: |
          (cd v2 && GOTOOLCHAIN=go1.26.0 GOPROXY=off GOSUMDB=off CGO_ENABLED=0 go build -o "$SWHURL_V2" ./cmd/swhurl-v2)
          make check-templates

  collector:
    name: Validate OTel collector configuration and fixtures
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Validate collector configuration in the image each release renders
        env:
          CONTAINER_RUNTIME: docker
        run: make check-otel

  # The console image (docs/console.md#deploy-a-new-console). On a push to main it is built alongside
  # the checks above, tagged with the commit SHA and with a hash of everything it is built from; if
  # that content hash is already published, nothing is built (docs and manifest commits). Only
  # deploy-console, after every check passed, makes a running console use it.
  console-image:
    name: Build the console image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/samclement/swhurl-console
    outputs:
      content: ${{ steps.source.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash what the image is built from
        id: source
        run: |
          set -Eeuo pipefail
          tag=$(bash images/content-tag.sh console)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content=${tag#src-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this content is already published
        id: existing
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:src-${{ steps.source.outputs.content }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Image for content ${{ steps.source.outputs.content }} already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/console/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # Layer cache in GitHub Actions (mode=max keeps the tools and deps stages too), so a
          # change under v2/ rebuilds only the v2 stage and the last layers.
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.revision }}
            ${{ env.IMAGE }}:src-${{ steps.source.outputs.content }}

      - name: Record the digest
        if: steps.existing.outputs.published == 'false'
        run: |
          {
            echo "### Published"
            echo
            echo "- image: \`$IMAGE:${{ steps.source.outputs.revision }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- content: \`src-${{ steps.source.outputs.content }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The backup jobs' image (docs/plan.md section 25), built and tagged like the console's. Nothing
  # deploys it: the backup CronJobs name a pinned digest in Git.
  backup-image:
    name: Build the backup image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/samclement/swhurl-backup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash what the image is built from
        id: source
        run: |
          set -Eeuo pipefail
          tag=$(bash images/content-tag.sh backup)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content=${tag#src-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this content is already published
        id: existing
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:src-${{ steps.source.outputs.content }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Backup image for content ${{ steps.source.outputs.content }} already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/backup/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.revision }}
            ${{ env.IMAGE }}:src-${{ steps.source.outputs.content }}

      - name: Check the tools run and record the digest
        if: steps.existing.outputs.published == 'false'
        run: |
          set -Eeuo pipefail
          image="$IMAGE@${{ steps.build.outputs.digest }}"
          # The image is one Go binary beside mongodump: no Python, AWS CLI or age CLI to call.
          docker run --rm --entrypoint mongodump "$image" --version >"$RUNNER_TEMP/mongodump"
          head -1 "$RUNNER_TEMP/mongodump"
          if docker run --rm "$image" >/dev/null 2>"$RUNNER_TEMP/usage"; then
            echo "swhurl-backup without a job ran instead of refusing" >&2; exit 1
          fi
          grep -q 'swhurl-backup backup-job-sqlite' "$RUNNER_TEMP/usage"
          {
            echo "### Published backup image"
            echo
            echo "- image: \`$IMAGE:${{ steps.source.outputs.revision }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- content: \`src-${{ steps.source.outputs.content }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys the image once every check above passed (a check skipped for an app-only commit counts
  # as passed): on the newest main it pins platform/console/helmrelease.yaml to that image, checks it
  # and pushes the commit like every bot (host/push-main.sh console-image --expect), unless main has
  # since moved to other image inputs, whose own run pins them. Pushes made with GITHUB_TOKEN start
  # no workflows, so the pin commit starts no Validate run.
  deploy-console:
    name: Deploy the console
    needs: [changes, validate, repo, apps, templates, collector, console-image, backup-image]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.console-image.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the pin commit to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pin is made again on a newer main when another writer pushed first

      # The pin is checked like every bot push (make check-repo check-apps on the newest main), and
      # check-apps compiles v2's records with Go; on a main whose records Render has not rendered yet the
      # pin renders them first, through the same Go binary.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: v2/go.sum

      - name: Download pinned v2 dependencies
        run: make v2-deps

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      # host/push-main.sh: a fresh worktree of the newest main, the pin (images/pin-console.sh), checks, one
      # commit, a non-forced push; a push lost to another writer pins again on the newer main.
      - name: Pin the console on main (deploys it)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -Eeuo pipefail
          host/push-main.sh console-image \
            --expect "src-${{ needs.console-image.outputs.content }}" | tee -a "$GITHUB_STEP_SUMMARY"
