name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      app_instance_only: ${{ steps.classify.outputs.app_instance_only }}
      tooling_tests_needed: ${{ steps.classify.outputs.tooling_tests_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pull request paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'app_instance_only=false' >> "$GITHUB_OUTPUT"
            echo 'tooling_tests_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" | python3 tools/ci_changes.py | tee -a "$GITHUB_OUTPUT"

  validate:
    name: Tooling tests, lint and dry runs
    needs: changes
    if: needs.changes.outputs.app_instance_only != 'true' || needs.changes.outputs.tooling_tests_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check

      - name: Lint Python tooling
        run: pipx run ruff==0.16.9 check tools tests

      - name: Lint remaining bash
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck -x $(git ls-files '*.sh')

      - name: Test operator safety, app contract and dry runs
        env:
          REQUIRE_HELM: '1'
        run: make test

      # The dry runs are not listed here: make test runs every target whose DRY_RUN=true only plans
      # (tools/swhurl/commands.py says which).
      - name: Render the lifecycle test fixture
        run: kubectl kustomize tests/fixtures/lifecycle-app >/dev/null

  repo:
    name: Validate manifests, schemas and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies and flux-schema
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check
          curl -fsSLo "$RUNNER_TEMP/flux-schema.tar.gz" \
            https://github.com/fluxcd/flux-schema/releases/download/v0.9.0/flux-schema_0.9.0_linux_amd64.tar.gz
          echo "104b764a53bcec30ec856a6a3efaecd13abf606099f0b057932027d755313cdb  $RUNNER_TEMP/flux-schema.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux-schema.tar.gz" -C "$RUNNER_TEMP/bin" flux-schema
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate active manifests and scripts
        run: make check-repo

  apps:
    name: Check app instances against policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: python3 -m pip install --group check

      - name: Check app instances against policy
        run: make check-apps

  templates:
    name: Check every app type against the templates
    needs: changes
    if: needs.changes.outputs.app_instance_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: python3 -m pip install --group check

      # A template that declares events gets its NATS key at creation, which app-new encrypts with SOPS
      # (public recipients only: no key is needed). The same release and checksum as the console image.
      - name: Install sops
        env:
          SOPS_VERSION: v3.12.1
          SOPS_SHA256: cf3136d20a6004405c986a48e179c3c7a731f777fbf105a37bd5dac5c9047100
        run: |
          curl -fsSLo sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops

      - name: Check every stack template combination against the app contract
        run: make check-templates

  collector:
    name: Validate OTel collector configuration and fixtures
    needs: changes
    if: needs.changes.outputs.app_instance_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: python3 -m pip install --group check

      - name: Cache checksum-verified OTel collector binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/swhurl-platform/otelcol
          key: otelcol-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/otel/helmrelease-*.yaml') }}
          restore-keys: |
            otelcol-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate collector configuration with its exact release
        run: make check-otel

  # The console image (docs/console.md#deploy-a-new-console). On a push to main it is built alongside
  # the checks above, tagged with the commit SHA and with a hash of everything it is built from; if
  # that content hash is already published, nothing is built (docs and manifest commits). Only
  # deploy-console, after every check passed, makes a running console use it.
  console-image:
    name: Build the console image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/samclement/swhurl-console
    outputs:
      content: ${{ steps.source.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash what the image is built from
        id: source
        run: |
          set -Eeuo pipefail
          paths=(images/console .dockerignore pyproject.toml uv.lock tools
                 clusters/home/flux-system/sources/configmap-platform-settings.yaml)
          content=$(for p in "${paths[@]}"; do git rev-parse "HEAD:$p"; done | sha256sum | cut -c1-16)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this content is already published
        id: existing
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:src-${{ steps.source.outputs.content }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Image for content ${{ steps.source.outputs.content }} already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/console/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # Layer cache in GitHub Actions (mode=max keeps the tools and deps stages too), so a
          # change under tools/ rebuilds only the last layers.
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.revision }}
            ${{ env.IMAGE }}:src-${{ steps.source.outputs.content }}

      - name: Record the digest
        if: steps.existing.outputs.published == 'false'
        run: |
          {
            echo "### Published"
            echo
            echo "- image: \`$IMAGE:${{ steps.source.outputs.revision }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- content: \`src-${{ steps.source.outputs.content }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The backup jobs' image (docs/plan.md section 25), built and tagged like the console's. Nothing
  # deploys it: the backup CronJobs name a pinned digest in Git.
  backup-image:
    name: Build the backup image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/samclement/swhurl-backup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash what the image is built from
        id: source
        run: |
          set -Eeuo pipefail
          paths=(images/backup .dockerignore pyproject.toml uv.lock tools
                 clusters/home/flux-system/sources/configmap-platform-settings.yaml)
          content=$(for p in "${paths[@]}"; do git rev-parse "HEAD:$p"; done | sha256sum | cut -c1-16)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this content is already published
        id: existing
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:src-${{ steps.source.outputs.content }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Backup image for content ${{ steps.source.outputs.content }} already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/backup/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.revision }}
            ${{ env.IMAGE }}:src-${{ steps.source.outputs.content }}

      - name: Check the tools run and record the digest
        if: steps.existing.outputs.published == 'false'
        run: |
          set -Eeuo pipefail
          image="$IMAGE@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint sh "$image" -c 'age --version && mongodump --version | head -1 && aws --version && python -c "import pymongo, swhurl.backup_job"'
          {
            echo "### Published backup image"
            echo
            echo "- image: \`$IMAGE:${{ steps.source.outputs.revision }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- content: \`src-${{ steps.source.outputs.content }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys the image once every check above passed (a check skipped for an app-only commit counts
  # as passed): on the latest main it pins platform/console/helmrelease.yaml to that image and pushes
  # the commit (swhurl console-image --expect --commit), unless main has since moved to other image
  # inputs, whose own run pins them. Pushes made with GITHUB_TOKEN start no workflows, so the pin
  # commit starts no Validate run.
  deploy-console:
    name: Deploy the console
    needs: [changes, validate, repo, apps, templates, collector, console-image, backup-image]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.console-image.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the pin commit to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pin commit may need a rebase onto a newer main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin the console on main (deploys it)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet --upgrade 'pip>=25.1'
          python3 -m pip install --quiet --group check
          git fetch --quiet origin main
          git checkout --quiet --detach origin/main
          PYTHONPATH=tools python3 -m swhurl console-image \
            --expect "src-${{ needs.console-image.outputs.content }}" --commit | tee -a "$GITHUB_STEP_SUMMARY"
