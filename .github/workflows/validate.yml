name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.4'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade 'pip>=25.1'
          python3 -m pip install --group check
          # Release binary (checksum pinned) instead of go install, which compiles it on every run.
          curl -fsSLo "$RUNNER_TEMP/flux-schema.tar.gz" \
            https://github.com/fluxcd/flux-schema/releases/download/v0.9.0/flux-schema_0.9.0_linux_amd64.tar.gz
          echo "104b764a53bcec30ec856a6a3efaecd13abf606099f0b057932027d755313cdb  $RUNNER_TEMP/flux-schema.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux-schema.tar.gz" -C "$RUNNER_TEMP/bin" flux-schema
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint Python tooling
        run: pipx run ruff==0.16.9 check tools tests

      - name: Lint remaining bash
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck -x $(git ls-files '*.sh')

      - name: Validate active manifests and scripts
        run: make check-repo

      - name: Test operator safety and app contract
        env:
          REQUIRE_HELM: '1'
        run: make test

      - name: Check app instances against policy
        run: make check-apps

      - name: Check every stack template combination against the app contract
        run: make check-templates

      - name: Validate OTel collector config with its collector release
        run: make check-otel

      - name: Run operator dry runs
        run: |
          set -Eeuo pipefail
          ./host/install-timer.sh dns --dry-run
          ./host/install-timer.sh backup --dry-run
          make install DRY_RUN=true
          make backup-mongodb DRY_RUN=true
          make live-test-restore-mongodb DRY_RUN=true
          make live-test-restore-sqlite DRY_RUN=true
          make live-test-lifecycle DRY_RUN=true
          make live-test-reloader DRY_RUN=true
          make live-test-app-template DRY_RUN=true
          kubectl kustomize tests/fixtures/lifecycle-app >/dev/null
          make platform-certs-staging DRY_RUN=true
          make platform-certs-prod DRY_RUN=true
          make help
