    text: "Decision D1 (operator, option 1): one rule for 'is there a fresh archive?', owned by v2/recovery/rules: an archive counts only when its metadata object sits beside it. If the newest archive is half-uploaded, restore and app status fall back to the previous complete one; an archive named with --from without metadata is still refused as incomplete/archive_metadata_absent. Keep restore flags and printed output stable otherwise. Planner's pointers: newestArchive (v2/recovery/rules/archive.go) counts an object only when '<key minus archive suffix>.json' is in the listing (as images/backup/tool/archive.go does), still aged by S3 LastModified; make the rule suffix-aware so observe can reuse it for .archive.gz.age in task 2. Tests: newest without metadata falls back; named without metadata refused; zero LastModified still malformed. Fixtures listing a .db.age alone must list sqlite-<UTC>.json beside it. Regenerate api.txt with 'go test ./archtest -run TestPublicAPI -update'."
