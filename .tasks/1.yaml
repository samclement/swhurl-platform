    commit: 12b9a3ba0e7f
    text: "done: recovery/rules: newest archive counts only with <name>.json listed beside it (suffix-aware newestArchive, exported MetadataKey used by plan.go); half-uploaded newest falls back for restore and status; --from without metadata still incomplete/archive_metadata_absent. Fixtures list metadata; api.txt regenerated. Not verified live."
