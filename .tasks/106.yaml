    text: "Approved design (operator, 2026-11-28): store merge-commit render fingerprint (Records, Settings, Digest, held) in the job record on first merged observation; Jobs saves Reached for any remembered record incl. earlier pods' (console server may write them: one replica, Recreate); delete ActivityFacts.reached, ConsoleEvidence, mergeTrees/toFetch/historicalTreesPerPage; keep Source.Files (telemetry_reads.go). Migration marker approved: the new console writes outcomes: true on every record it saves; a record without it and without target/Reached shows 'historical: before the console recorded outcomes' with no read; one-way, no fallback to reading history. Tests: ProgressOf table incl. historical; settled record survives a new Jobs load; target captured once."
