    text: "Slice 2 (delivery), plan block 5. Decisions (operator, 2026-11-22): 1A copy the write plumbing promote/deploy share into v2/delivery/write.go, each copy naming its origin, and record 'two copies until slice 5' in the plan; 2A move only SelectPromotion, kernel.SelectRelease stays (deferred to apps/provisioning); 3A move Currentness/Changes and PromotionReadiness to delivery/rules now, observation document keeps Version 5 and the same JSON. Task 7 also records in the plan's deferred list that observe/explain.go's 'unit applied this revision' rule duplicates the currentness rule. Commands keep flags, output and effects; delete the old copies, no shims. make check-docs is not a check (fails on an uncommitted tree). Planner's pointers: `observe/changes.go` moves whole to `delivery/rules/changes.go` with its export names (`Currentness`, `Changes`, `Comparison`, `ChangeScope`, `DecodeChanges`, `CurrentnessOf`), using task 0's vocabulary instead of observe's private copies; `observe/changes_test.go` is already `package observe_test` and moves with it. The judge stays single: `observe/explain.go:219-222` calls `rules.CurrentnessOf`, and `observe.Target.Scope` (`explain.go:40`), `observe.Evidence.Changes` (`:126-128`), `observe.Report.Currentness` (`:150`) and the report document field (`report.go:26,69`) take the rules' types. Callers to update: `orchestration/console.go:310-344`, `orchestration/status.go:24`, `orchestration/status_all.go:23-24,138`, `orchestration/status_scope.go:27`, `cmd/swhurl-v2/status_all.go:162,174`, and the tests `orchestration/console_internal_test.go:13`, `orchestration/status_all_test.go:435,444`, `cmd/swhurl-v2/status_all_test.go:52`, `observe/batch_test.go:93,104`. The report's JSON must not move: same field names, `Version` stays 5 — a status document is byte-identical for the same evidence, so `cmd` status tests need only type names. Do not touch `observe/explain.go:305-320`'s own revision *finding*: reporting the unit's revision is health's, and collapsing the two is a separate change."
