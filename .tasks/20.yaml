    text: "Slice 2 (delivery), plan block 0. Decision (conductor, operator approved running slice 3 on the planner's recommendations, 2026-11-22): Q1 subpackages: incident, heartbeat and notify move unchanged as notifications/rules/{incident,heartbeat,notify} (package names unchanged); v2/notifications is the one layer-2 use-case package. Per slice 2's decision 1A, a small helper two use-case packages need is copied with a comment naming its origin; use-case packages don't import each other. Commands keep flags, output and effects; delete old copies, no shims. You may regenerate api.txt with 'go test ./archtest -run TestPublicAPI$ -update' (only that test, so budgets.json is untouched). make check-docs is not a check (fails on an uncommitted tree). If a file outside scope must change, release the task saying which file. Planner's pointers: Slice 3 layout decision: the three pure packages move under `notifications/rules/` as their own subpackages (package names stay `incident`, `heartbeat`, `notify`), so no exported name or test changes, and `notifications` becomes the single layer-2 use-case package. `v2/incident` is already layer 0 (`v2/archtest/rules_test.go:79,81,83,155`), so this is a path move, not a layer change. Create `v2/notifications/notifications.go` with only the package doc (the notify service, checker and host-heartbeat use cases; decisions live in `notifications/rules/...`); `git mv` every `v2/incident` file, including `testdata/`, to `v2/notifications/rules/incident/`. Update importers: `v2/orchestration/notifications_check.go:11`; `v2/orchestration/notifications_check_test.go:18` and its `os.ReadFile(\"../incident/testdata/snapshot.json\")` at `:45` (now `../notifications/rules/incident/testdata/snapshot.json`); `v2/cmd/swhurl-v2/notifications_check_test.go:14`. archtest `v2/archtest/rules_test.go`: in `Layers` (`:68`) remove `\"incident\": 0`, add `\"notifications\": 2` and `\"notifications/rules/incident\": 0`; append `\"notifications\"` to `Orche