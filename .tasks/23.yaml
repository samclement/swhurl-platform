8` into `v2/notifications/heartbeat.go` (used at `:138,142`) with the same kind of comment. archtest: add `\"notifications\": 2` to `Layers` and append `\"notifications\"` to `Orchestration`; add a `TestCheckLayers` fixture such as `\"notifications/n.go\": import \"example.com/v2/orchestration\"` expecting `layers notifications/n.go:3: notifications (layer 2) imports orchestration (layer 2)`. `api.txt`: remove the exported lines for the moved orchestration symbols and add the same names under `notifications:`; `publicAPI` sorts bytewise, so `notifications/rules/...` blocks come before `notifications:` and `notifications:` before the remaining `notify`-prefixed keys. Flags, JSON logs, exit codes and cluster effects must not change; the moved pure packages and command tests pass with only package/import names changed. `incident/health.go`'s deployment-health rule moves as-is; folding any overlap into delivery's readiness is slice 4's work, not this move."
