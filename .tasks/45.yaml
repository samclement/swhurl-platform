    text: "Decision: ONE status state, computed in one apps function from delivery/rules' deployment-health verdict (DeploymentHealthOf/ReleaseHealthOf) composed with delivery's revision currentness (task 37); no second side-by-side field. observe.StateOf's judgement is deleted, not kept. Status keeps 'unknown' for facts it could not read. A rollback (delivery's healthy-after-rollback) gets its own state value 'rolled back' (not 'updating'); a rollout in progress stays 'updating'; a stuck/retrying release or unit not Ready is 'stalled'. Report document Version 6; console rows/pages labels/CSS handle new states; exit codes unchanged; no new cluster reads. Table test covers the disagreement cases: rollback, Retrying/InstallFailed, unit not Ready, suspended+unready workload, unreadable workload, deleting release."
