    commit: 7f70a48d5699
    text: "Slice 2 (delivery), plan block 0. Decisions (operator, 2026-11-22): 1A copy the write plumbing promote/deploy share into v2/delivery/write.go, each copy naming its origin, and record 'two copies until slice 5' in the plan; 2A move only SelectPromotion, kernel.SelectRelease stays (deferred to apps/provisioning); 3A move Currentness/Changes and PromotionReadiness to delivery/rules now, observation document keeps Version 5 and the same JSON. Task 7 also records in the plan's deferred list that observe/explain.go's 'unit applied this revision' rule duplicates the currentness rule. Commands keep flags, output and effects; delete the old copies, no shims. make check-docs is not a check (fails on an uncommitted tree). Planner's pointers: `delivery.go` is the package doc only (\"delivery is the delivery capability's use cases: release selection, staging-to-production promotion, deployment, and the evidence that a requested revision landed. Its decisions are delivery/rules'; this package reads, sequences and writes.\"). `rules.go` lands the vocabulary its later users share, so parallel tasks cannot each declare it (a duplicate declaration will not compile): package doc, `type Code string` + `Error{Code, Field, Reason}` + `refuse`/`invalid` with the same text shapes as `kernel/records.go:11-29` (codes `invalid`, `unsupported`, `wrong_application`, `wrong_release`), read-status words `Present/Absent/Unavailable/NotRead` (as `recovery/rules/rules.go:36-40`), `revisionPattern`/`digestPattern` (`observe/explain.go:651,661`), `appliedCommit`/`unitReason` (`observe/explain.go:326,341`), `ReasonNotSupplied`/`ReasonNotAppliedRev`/`ReasonRevisionShape` (`observe/explain.go:83-85`), `repositoryPath`/`containsField` (`observe/changes.go:152,100`). All unexported, so api.txt should not change — confirm with `-update` producing no diff for those two packages. archtest: add `\"delivery\": 2`, `\"delivery/rules\": 0` to `Layers` beside `recovery` (`archtest/rules_test.go:126-127`), `\"delivery\"` to `Orchestration` (`:142`), `\"delivery/rules\"` to `Pure` (`:150`), `\"observe\": {\"recovery/rules\", \"delivery/rules\"}` and `\"delivery/rules\": {\"kernel\"}` to `PureDependencies` (`:136`); entries are allowances, so unused ones are harmless. Add fixtures to `archtest/checks_test.go` after the recovery ones (`:73-80`, `:126-135`): a `delivery/rules` file calling `time.Now` is refused, and `delivery/rules` importing `observe` is refused while `observe` importing `delivery/rules` is allowed."
