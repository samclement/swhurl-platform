  - at: 2026-11-22T21:19:50.753Z
    commit: 145d3cb773a6
    text: "Source evidence: exec_test.go:394-412 creates a 50ms parent deadline BEFORE execRequest(t) reads/validates/unmarshals testdata/exec.json (kube_test.go:31-40), Exec validation, dial and TLS; no handler-entry signal exists. Only the handler, AFTER its request context is done, closes done. Exec accepts the parent via WithTimeout(30s), so the earlier 50ms still wins (exec.go:46-58). upgradeExec passes that context into coder/websocket v1.8.15 Dial (exec.go:104-114); pinned dial.go:188-227 uses http.NewRequestWithContext then HTTPClient.Do. NewAPI clones the supplied client without replacing transport (kube.go:101-118). Go 1.26.0 net/http transport.go:673-678,1516-1590 permits return on cancellation before obtaining/writing a request; :2950-2958 cancels an in-flight HTTP/1 request by cancelRequest, which closes its connection (:2206-2211). server.go:2060-2073 starts a background read before invoking the handler; read errors cancel connection/request context (:759-775). httptest TLS defaults to HTTP/1.1 here (httptest/server.go:177-195). No lost context propagation was found by inspection."
  - at: 2026-11-22T21:19:50.925Z
    commit: 145d3cb773a6
    text: 'Evidenced interleaving in all 150 passing iterations: handler entered -> handler observed request-context done -> handler closed done -> test received done after Exec returned a nonnil error. Existing output cannot order handler entry relative to parent expiry or Exec return, or establish that the error was timed_out rather than another failure. Hypothesis (plausible, NOT reproduced/proven): expiry during fixture I/O, scheduling or dial/TLS can return from Exec without invoking any handler, so done never closes and the test reports "withheld upgrade not cancelled" one second later despite correct cancellation. Competing hypothesis (not evidenced or ruled out for prior failures): handler entered but server-side cancellation was delayed/lost. A single done channel plus nonnil-error assertion cannot distinguish them. A true active-handler hang could also block deferred httptest.Server.Close, which leaves StateActive connections open and waits (Go httptest/server.go:240-279); not observed here.'
  - at: 2026-11-22T21:19:51.118Z
    commit: 145d3cb773a6
    text: 'Bounded follow-up proposal FOR APPROVAL ONLY; nothing implemented: instrument only TestExecCancellationWhileWaitingForUpgrade with a buffered handler-entry timestamp/event plus cancellation-observed timestamp, and record parent deadline/context error, Exec start/return/error reason, and httptrace TLSHandshakeStart/Done, GotConn, WroteRequest timestamps on assertion failure. Synchronize observations with channels (no sleeps, retries, shared unsynchronized fields or payload/header logging). Entry absent at failure supports the pre-handler path; entry present with cancellation unobserved supports the after-entry path. Then replace the timing assumption in this test with explicit handler-entry handshake: prepare fixture first, run Exec with a cancelable context, wait for handler entry with a bounded guard, cancel explicitly, and independently bound Exec return and handler cancellation; assert Failed/exec/timed_out. Ensure failure cleanup cancels and closes test client connections before server.Close so cleanup cannot hide evidence. If deadline semantics need separate coverage, use an already-expired context and assert timed_out without requiring server entry. Keep production unchanged unless instrumented evidence implicates it. Validate proposed test-only change with the same leased 100x and race 50x commands, targeted exec tests and make check-v2; no baseline update or weakened assertion. Final acceptance check already ran: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)" exited 0. Next dependency is operator approval of test instrumentation/reshape; prior failure root cause remains unproven.'
