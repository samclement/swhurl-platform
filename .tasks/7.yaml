    text: "Slice 2 (delivery), plan block 1. Decisions (operator, 2026-11-22): 1A copy the write plumbing promote/deploy share into v2/delivery/write.go, each copy naming its origin, and record 'two copies until slice 5' in the plan; 2A move only SelectPromotion, kernel.SelectRelease stays (deferred to apps/provisioning); 3A move Currentness/Changes and PromotionReadiness to delivery/rules now, observation document keeps Version 5 and the same JSON. Task 7 also records in the plan's deferred list that observe/explain.go's 'unit applied this revision' rule duplicates the currentness rule. Commands keep flags, output and effects; delete the old copies, no shims. make check-docs is not a check (fails on an uncommitted tree). Planner's pointers: `git mv v2/orchestration/promote.go v2/delivery/promote.go` and the same for its test; `Promote`, `PromoteInputs`, `Promotion` keep their names and fields, so `cmd/swhurl-v2/promote.go` changes only its import and `orchestration.`→`delivery.` (`:56,97-131`). `write.go` copies, verbatim with a one-line note saying which package it came from: `Refusal`, `reasonOf`, `unavailable` (`orchestration/usecase.go:20-40`), `recordsRoot` (`orchestration/records.go:7`), `writeCompiled`+`prune` (`orchestration/orchestration.go:108-136`), `documents` (`:164-182`), `WithOffers`+`plainName`+`instanceFolder`+`refuseOffers` (`:184-224`), `instanceDocuments` (`orchestration/deploy.go:181-204`) — deploy (task 3) reuses them, do not redeclare. `fixtures_test.go` holds `fixture(t,name)` (`orchestration/deploy_test.go:30-37`, reads `../testdata`) plus any promote-only fixture helper, because `orchestration/promote_test.go` borrows `fixture` today; delivery sits at the same depth so `../testdata` paths still work. `kernel.SelectPromotion` is still called as-is; task 2 moves it. Promote's document kind, `promoteNote`, the stderr summary and exit statuses must not change (`cmd/swhurl-v2/promote_test.go` passes unmodified apart from type names)."
