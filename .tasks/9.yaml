    text: "Slice 2 (delivery), plan block 3. Decisions (operator, 2026-11-22): 1A copy the write plumbing promote/deploy share into v2/delivery/write.go, each copy naming its origin, and record 'two copies until slice 5' in the plan; 2A move only SelectPromotion, kernel.SelectRelease stays (deferred to apps/provisioning); 3A move Currentness/Changes and PromotionReadiness to delivery/rules now, observation document keeps Version 5 and the same JSON. Task 7 also records in the plan's deferred list that observe/explain.go's 'unit applied this revision' rule duplicates the currentness rule. Commands keep flags, output and effects; delete the old copies, no shims. make check-docs is not a check (fails on an uncommitted tree). Planner's pointers: `DeployImage`/`DeployInputs`/`Deploy` keep their names and fields (`orchestration/deploy.go:68`); `cmd/swhurl-v2/deploy.go:40-136` and `deploy_records.go:108-110` only swap the import and `orchestration.`→`delivery.`. `instanceDocuments` already lives in `v2/delivery/write.go` after task 1 — delete the `orchestration/deploy.go:181` copy rather than moving it, and do not add a second `fixture` helper (task 1's `v2/delivery/fixtures_test.go`). Move the deploy-only test helpers (`declarationLabel`, `newDigest`/`newCommit`) with the test. Both document kinds, the `--records` bulk report and every outcome word (`changed`/`unchanged`/`refused`/`failed`) stay as they are."
