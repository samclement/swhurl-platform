# The events demo-orders publishes, as an AsyncAPI document (https://www.asyncapi.com/docs).
# This file is the declaration: the platform reads it to show other apps what they can subscribe
# to, and src/events.ts refuses to publish an event that is not here or a payload that does not
# fit its schema. To add an event: a channel (its address is the event's name), a message with a
# payload schema and an example, and a send operation.
asyncapi: 3.0.0
info:
  title: demo-orders
  version: 0.1.0
  description: "Demo: takes orders, keeps them in SQLite, describes its API and publishes an event for each"
channels:
  created:
    address: created
    description: An order was placed and stored.
    messages:
      created:
        $ref: '#/components/messages/created'
operations:
  publishCreated:
    action: send
    channel:
      $ref: '#/channels/created'
components:
  messages:
    created:
      summary: One order, as GET /orders/{id} returns it
      payload:
        type: object
        required: [id, item, quantity, placedBy, at]
        additionalProperties: false
        properties:
          id:
            type: string
            description: The order's id
          item:
            type: string
          quantity:
            type: integer
            minimum: 1
          placedBy:
            type: string
            description: The app that placed it
          at:
            type: string
            format: date-time
      examples:
        - payload:
            id: 3f0c7d0e-6f0f-4b3e-9d4f-0a8f6d1c2b3a
            item: tea
            quantity: 2
            placedBy: demo-shop
            at: '2026-01-01T00:00:00.000Z'
