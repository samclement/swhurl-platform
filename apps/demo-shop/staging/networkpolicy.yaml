apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-shop
  namespace: demo-shop-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: demo-shop
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-shopper-staging
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: demo-shopper
    ports:
    - port: 8080
      protocol: TCP
