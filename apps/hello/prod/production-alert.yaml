apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: app-hello-production
  namespace: flux-system
spec:
  providerRef:
    name: ntfy-deploys
  eventSeverity: info
  eventSources:
  - kind: HelmRelease
    name: hello
    namespace: hello-prod
  inclusionList:
  - .*succeeded.*
