apiVersion: v1
kind: Secret
metadata:
  name: swhurl-try-10-backup
  namespace: swhurl-try-10-prod
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: swhurl-try-10-backup
  namespace: swhurl-try-10-prod
  labels:
    platform.swhurl.com/backup: 'true'
spec:
  schedule: 7 4 * * *
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            platform.swhurl.com/backup: 'true'
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/samclement/swhurl-backup:src-caf51b4f61fadd4a@sha256:49474ad990df0f69a31cadd365ce28f20dad48a8e4edebac0c84ab080450250c
            args:
            - backup-job-sqlite
            env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HTTP_PROXY
              value: http://egress.egress.svc.cluster.local:30113
            - name: HTTPS_PROXY
              value: http://egress.egress.svc.cluster.local:30113
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.cluster.local,$(HOST_IP)
            - name: AGE_RECIPIENT
              value: age1u79dp6zjkal33l7rguzqxy66rwykhq90msrw47tf0vy4mu2jh3hsrkmn7h
            - name: BACKUP_S3_URI
              value: s3://swhurl-platform-backups-110927251694/app-sqlite/swhurl-try-10-prod/
            - name: BACKUP_SOURCE
              value: swhurl-try-10-prod/swhurl-try-10
            - name: DATABASE_PATH
              value: /data/app.db
            envFrom:
            - secretRef:
                name: swhurl-try-10-backup
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: swhurl-try-10
          - name: scratch
            emptyDir:
              sizeLimit: 1Gi
          - name: tmp
            emptyDir: {}
