apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swhurl-try-13
  namespace: swhurl-try-13-staging
  annotations:
    platform.swhurl.com/offers: 900f5e5
    platform.swhurl.com/render: 3dcc64195d221f88c01f1f24da0c6781e67efc0ed9ff7e196760ebfb9571309c
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/samclement/swhurl-try-13
              tag: 73-900f5e5
              digest: sha256:124b834e9df60ac02d49de8a488105c24d95746dbb3295129d171f5cfcd997d8
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
              SWHURL_APP: swhurl-try-13
              SWHURL_ENV: staging
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
              SWHURL_DESCRIPTION: 'throwaway: team platform T4 subscriber (notifier), delete me'
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              OTEL_EXPORTER_OTLP_ENDPOINT: http://$(HOST_IP):4318
              OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
              OTEL_SERVICE_NAME: swhurl-try-13
              SWHURL_EVENTS_PUBLISH: worked
              SWHURL_EVENTS_NKEY: UD2OPEOUJ7C3V2TCCLNQBNGYT67UJUPQQU7D3HWQG6MU5XVVGAWQEXI5
              SWHURL_EVENTS_URL: nats://nats.messaging.svc.cluster.local:4222
              HTTP_PROXY: http://egress.egress.svc.cluster.local:30108
              HTTPS_PROXY: http://egress.egress.svc.cluster.local:30108
              JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=egress.egress.svc.cluster.local -Dhttp.proxyPort=30108 -Dhttps.proxyHost=egress.egress.svc.cluster.local -Dhttps.proxyPort=30108 -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local|$(HOST_IP)
              NODE_USE_ENV_PROXY: '1'
              NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,$(HOST_IP)
            envFrom:
            - secretRef:
                name: swhurl-try-13-events
        annotations:
          secret.reloader.stakater.com/reload: swhurl-try-13-events
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
