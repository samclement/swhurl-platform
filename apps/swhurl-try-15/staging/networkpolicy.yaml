apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swhurl-try-15
  namespace: swhurl-try-15-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: swhurl-try-15
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8080
      protocol: TCP
