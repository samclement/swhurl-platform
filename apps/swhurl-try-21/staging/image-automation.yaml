apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: swhurl-try-21
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: swhurl-try-21
spec:
  image: ghcr.io/samclement/swhurl-try-21
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: swhurl-try-21-staging
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: swhurl-try-21
spec:
  imageRepositoryRef:
    name: swhurl-try-21
  filterTags:
    pattern: ^(?P<run>[0-9]+)-[0-9a-f]{7,40}$
    extract: $run
  policy:
    numerical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1h
