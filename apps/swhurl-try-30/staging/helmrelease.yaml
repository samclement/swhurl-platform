apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swhurl-try-30
  namespace: swhurl-try-30-staging
  annotations:
    platform.swhurl.com/offers: 6fbe706
    platform.swhurl.com/render: d62fa0defcadcf16a095d835d89145409428f78dec2a952d413573df938c1d13
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/samclement/swhurl-try-30
              tag: 20-6fbe706
              digest: sha256:6084fdb7912b0a20739162f93350a7b65f4512451034d58103975992ab0394c7
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
              SWHURL_APP: swhurl-try-30
              SWHURL_ENV: staging
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
              SWHURL_DESCRIPTION: A swhurl app
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              OTEL_EXPORTER_OTLP_ENDPOINT: http://$(HOST_IP):4318
              OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
              OTEL_SERVICE_NAME: swhurl-try-30
              SWHURL_EVENTS_PUBLISH: worked
              SWHURL_EVENTS_NKEY: UBTCKXIUCXRB4YTWXISTJOPF7MXC5WTHXYXCMYXL54WTFODONHIN3ONJ
              SWHURL_EVENTS_URL: nats://nats.messaging.svc.cluster.local:4222
              HTTP_PROXY: http://egress.egress.svc.cluster.local:30109
              HTTPS_PROXY: http://egress.egress.svc.cluster.local:30109
              JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=egress.egress.svc.cluster.local -Dhttp.proxyPort=30109 -Dhttps.proxyHost=egress.egress.svc.cluster.local -Dhttps.proxyPort=30109 -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local|$(HOST_IP)
              NODE_USE_ENV_PROXY: '1'
              NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,$(HOST_IP)
            envFrom:
            - secretRef:
                name: swhurl-try-30-events
        annotations:
          secret.reloader.stakater.com/reload: swhurl-try-30-events
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
