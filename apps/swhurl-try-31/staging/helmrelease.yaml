apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swhurl-try-31
  namespace: swhurl-try-31-staging
  annotations:
    platform.swhurl.com/offers: 2db8ffc
    platform.swhurl.com/render: 1c10a0fd8c858613f0bc66361d94c1d03a2bd8e8d92b8fec6b7e49d8cffdb317
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/samclement/swhurl-try-31
              tag: 16-2db8ffc
              digest: sha256:43473cf1db3ea3a5fdfc3379dc953a2418d87858be56f59ca786a50d7dc2681e
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
              SWHURL_APP: swhurl-try-31
              SWHURL_ENV: staging
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
              SWHURL_DESCRIPTION: B3 concurrent records-only creation proof
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              OTEL_EXPORTER_OTLP_ENDPOINT: http://$(HOST_IP):4318
              OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
              OTEL_SERVICE_NAME: swhurl-try-31
              SWHURL_EVENTS_PUBLISH: worked
              SWHURL_EVENTS_NKEY: UAMZ4WQFANV4QSBMND66ESMQAA6ZVIG244H3TR3HUGHKE7CDHBNSSILG
              SWHURL_EVENTS_URL: nats://nats.messaging.svc.cluster.local:4222
              HTTP_PROXY: http://egress.egress.svc.cluster.local:30117
              HTTPS_PROXY: http://egress.egress.svc.cluster.local:30117
              JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=egress.egress.svc.cluster.local -Dhttp.proxyPort=30117 -Dhttps.proxyHost=egress.egress.svc.cluster.local -Dhttps.proxyPort=30117 -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local|$(HOST_IP)
              NODE_USE_ENV_PROXY: '1'
              NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,$(HOST_IP)
            envFrom:
            - secretRef:
                name: swhurl-try-31-events
        replicas: 1
        annotations:
          secret.reloader.stakater.com/reload: swhurl-try-31-events
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
