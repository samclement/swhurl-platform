apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swhurl-try-32
  namespace: swhurl-try-32-staging
  annotations:
    platform.swhurl.com/offers: 545c2c7
    platform.swhurl.com/render: 8c946258adc1bb6bde33bccd37fd698fff6633d84642db8f9432d08095e1f601
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/samclement/swhurl-try-32
              tag: 23-545c2c7
              digest: sha256:14ef2d2d442354827721b0e3fbf21594dc0b073d86ba915f0bf9ee042b959a76
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
              SWHURL_APP: swhurl-try-32
              SWHURL_ENV: staging
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
              SWHURL_DESCRIPTION: B3 concurrent records-only creation proof
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              OTEL_EXPORTER_OTLP_ENDPOINT: http://$(HOST_IP):4318
              OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
              OTEL_SERVICE_NAME: swhurl-try-32
              SWHURL_EVENTS_PUBLISH: worked
              SWHURL_EVENTS_NKEY: UAYLR5I6357MJOSXJRXVBCHEBXJXECPGSJQSCQTFVGWYMFKTS5MLSWUV
              SWHURL_EVENTS_URL: nats://nats.messaging.svc.cluster.local:4222
              HTTP_PROXY: http://egress.egress.svc.cluster.local:30116
              HTTPS_PROXY: http://egress.egress.svc.cluster.local:30116
              JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=egress.egress.svc.cluster.local -Dhttp.proxyPort=30116 -Dhttps.proxyHost=egress.egress.svc.cluster.local -Dhttps.proxyPort=30116 -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local|$(HOST_IP)
              NODE_USE_ENV_PROXY: '1'
              NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,$(HOST_IP)
            envFrom:
            - secretRef:
                name: swhurl-try-32-events
        annotations:
          secret.reloader.stakater.com/reload: swhurl-try-32-events
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
