apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: swhurl-try-6
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: swhurl-try-6
spec:
  image: ghcr.io/samclement/swhurl-try-6
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: swhurl-try-6-staging
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: swhurl-try-6
spec:
  imageRepositoryRef:
    name: swhurl-try-6
  filterTags:
    pattern: ^(?P<run>[0-9]+)-[0-9a-f]{7,40}$
    extract: $run
  policy:
    numerical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: swhurl-try-6-staging
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: swhurl-try-6
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform-write
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "deploy: staging image for swhurl-try-6\n{{ range .Changed.Changes
        }}\n- {{ .OldValue }} -> {{ .NewValue }}\n{{- end }}"
    push:
      branch: main
  update:
    path: ./apps/swhurl-try-6/staging
    strategy: Setters
