# Teams that own apps. An app names one with `team:` in its swhurl.yaml or `make app-team`;
# it becomes the platform.swhurl.com/team label on the app's namespaces (docs/apps.md#teams).
teams:
  payments:
    description: Orders and payments (team platform scenario)
    notify:
    - payments
  insights:
    description: Reporting (team platform scenario)
    notify:
    - insights
  demo:
    notify:
    - platform
    description: 'Apps that show how to use the platform: calling an API securely, events, a database, notifications'
