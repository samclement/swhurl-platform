apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: test-1
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: test-1
spec:
  image: ghcr.io/samclement/test-1
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: test-1-staging
  namespace: flux-system
  labels:
    platform.swhurl.com/managed: 'true'
    platform.swhurl.com/app: test-1
spec:
  imageRepositoryRef:
    name: test-1
  filterTags:
    pattern: ^(?P<run>[0-9]+)-[0-9a-f]{7,40}$
    extract: $run
  policy:
    numerical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1h
