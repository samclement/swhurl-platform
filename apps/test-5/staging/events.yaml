apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: staging-test-5
  namespace: test-5-staging
spec:
  name: staging-test-5
  subjects:
  - staging.test-5.>
  storage: file
  replicas: 1
  retention: limits
  discard: old
  maxAge: 168h
  maxBytes: 67108864
---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: demo-orders-created
  namespace: test-5-staging
spec:
  streamName: staging-demo-orders
  durableName: test-5_created
  filterSubject: staging.demo-orders.created
  ackPolicy: explicit
  deliverPolicy: all
  ackWait: 30s
  maxDeliver: 5
