apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-demo-notifier-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-image-automation
  - name: platform-nats
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/demo-notifier/staging
  prune: true
  wait: true
  timeout: 3m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
