apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-demo-shop-prod
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-oauth2-proxy
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/demo-shop/prod
  prune: true
  wait: true
  timeout: 3m
