apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-demo-shop-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-oauth2-proxy
  - name: platform-image-automation
  - name: platform-nats
  - name: platform-backup
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/demo-shop/staging
  prune: true
  wait: true
  timeout: 3m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
    - kind: Secret
      name: backup-writer
      optional: false
