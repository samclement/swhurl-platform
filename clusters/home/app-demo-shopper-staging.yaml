apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-demo-shopper-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-image-automation
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/demo-shopper/staging
  prune: true
  wait: true
  timeout: 3m
