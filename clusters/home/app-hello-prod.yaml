apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-app-hello-prod
  namespace: flux-system
spec:
  dependsOn:
  - name: homelab-cluster-base
  - name: homelab-auth
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./tenants/apps/hello/prod
  # Temporary: keeps the app's objects when this unit is replaced by app-hello-prod (plan step 4).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 10m
