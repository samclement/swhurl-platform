apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-hello-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-oauth2-proxy
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/hello/staging
  prune: true
  wait: true
  timeout: 10m
