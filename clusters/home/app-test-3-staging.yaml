apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-test-3-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-oauth2-proxy
  - name: platform-image-automation
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/test-3/staging
  prune: true
  wait: true
  timeout: 3m
