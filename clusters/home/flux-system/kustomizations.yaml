apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-sources
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./clusters/home/flux-system/sources
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-sources
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./clusters/home
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  # Applies the unit definitions without waiting for the units: a slow or failing
  # unit cannot hold new definitions back. make flux-reconcile waits (swhurl flux-wait).
  wait: false
  timeout: 5m
