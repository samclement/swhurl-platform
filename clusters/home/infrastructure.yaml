apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-infrastructure
  namespace: flux-system
spec:
  dependsOn:
    - name: homelab-flux-sources
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./infrastructure/overlays/home
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-settings
        optional: false
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 20m
