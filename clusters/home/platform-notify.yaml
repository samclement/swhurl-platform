# Notification channels and team routes, read by the notification checker (docs/services.md#notification-channels).
# It decrypts the channel Secrets (platform/notify/channels, written by swhurl-v2 team) and the alert Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-notify
  namespace: flux-system
  labels:
    platform.swhurl.com/alert: failures
spec:
  dependsOn:
    - name: infra-base
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./platform/notify
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 10m
