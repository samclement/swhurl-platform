# Notification channels and team routes, read by the notification checker (docs/services.md#notification-channels).
# In its own file because make channel-add and make channel-remove edit it: the unit decrypts only while a channel exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-notify
  namespace: flux-system
  labels:
    platform.swhurl.com/alert: failures
spec:
  dependsOn:
    - name: infra-base
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./platform/notify
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 10m
