apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-auth
  namespace: flux-system
spec:
  dependsOn:
    - name: homelab-cluster-base
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./platform-services/oauth2-proxy/base
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-settings
        optional: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 10m
---
