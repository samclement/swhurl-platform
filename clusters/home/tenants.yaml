apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: homelab-platform
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./tenants/app-envs
  # Shared unit: deleting this Kustomization orphans (keeps) its resources.
  # Removing a resource from Git still prunes it (prune: true).
  deletionPolicy: Orphan
  prune: true
  wait: true
  timeout: 20m
