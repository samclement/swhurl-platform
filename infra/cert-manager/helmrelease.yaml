apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    extraArgs: ["--logging-format=json"]
    webhook:
      extraArgs: ["--logging-format=json"]
    cainjector:
      extraArgs: ["--logging-format=json"]
    crds:
      enabled: true
    startupapicheck:
      enabled: false
