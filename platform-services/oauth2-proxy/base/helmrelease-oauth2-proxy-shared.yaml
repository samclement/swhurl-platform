apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy-shared
  namespace: ingress
spec:
  interval: 30m
  releaseName: oauth2-proxy-shared
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.1.3
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Restart when the client/cookie Secret changes (homelab-reloader).
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: oauth2-proxy-shared-secret
    authenticatedEmailsFile:
      enabled: true
      persistence: configmap
      restricted_access: |-
        sam@swhurl.com
    config:
      existingSecret: oauth2-proxy-shared-secret
      # Override the chart's permissive email_domains = [ "*" ] default.
      configFile: |-
        email_domains = []
    extraArgs:
      provider: oidc
      oidc-issuer-url: https://accounts.google.com
      redirect-url: https://oauth.${BASE_DOMAIN}/oauth2/callback
      upstream: static://202
      reverse-proxy: true
      skip-provider-button: true
      cookie-name: _oauth2_proxy_shared
      cookie-domain: .${BASE_DOMAIN}
      whitelist-domain: .${BASE_DOMAIN}
      cookie-secure: "true"
      standard-logging: true
      request-logging: true
      auth-logging: true
      silence-ping-logging: true
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "${CERT_ISSUER}"
      path: /oauth2
      pathType: Prefix
      hosts:
        - oauth.${BASE_DOMAIN}
      tls:
        - secretName: oauth2-proxy-shared-tls
          hosts:
            - oauth.${BASE_DOMAIN}
