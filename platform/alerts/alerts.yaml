# Infrastructure/source failures use Flux's generic ntfy provider (docs/services.md#alerts).
# Kustomization sources carry platform.swhurl.com/alert=failures labels; app and console
# units are excluded so the notification checker owns their lifecycle and health.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: ntfy-platform
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: ntfy-platform
---
# Infrastructure apply/health failures, source fetch failures and image scan or policy errors.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: failures
  namespace: flux-system
spec:
  providerRef:
    name: ntfy-platform
  eventSeverity: error
  # Expected for a moment whenever an app with automatic deploys is added (its ImagePolicy runs before the
  # ImageRepository's first scan) or removed (the ImageRepository goes first). A repository that cannot be
  # scanned still alerts through its own ImageRepository event.
  exclusionList:
    - 'no tags in database'
    - 'referenced ImageRepository does not exist'
  eventSources:
    - kind: Kustomization
      name: '*'
      matchLabels:
        platform.swhurl.com/alert: failures
    - kind: GitRepository
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
