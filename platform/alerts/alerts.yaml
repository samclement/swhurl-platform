# Infrastructure/source failures use Flux's generic ntfy provider (docs/services.md#alerts).
# App and console lifecycle/health belong to the notification checker: naming their
# units here too would duplicate its incident messages. Infrastructure unit coverage
# is checked against the repository in tests/test_notifications.py.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: ntfy-failures
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: ntfy-failures
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: ntfy-deploys
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: ntfy-deploys
---
# Infrastructure apply/health failures, source fetch failures and image automation errors.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: failures
  namespace: flux-system
spec:
  providerRef:
    name: ntfy-failures
  eventSeverity: error
  # Expected for a moment whenever an app with automatic deploys is added (its ImagePolicy runs before the
  # ImageRepository's first scan) or removed (the ImageRepository goes first). A repository that cannot be
  # scanned still alerts through its own ImageRepository event.
  exclusionList:
    - 'no tags in database'
    - 'referenced ImageRepository does not exist'
  eventSources:
    - kind: Kustomization
      name: cluster-sources
    - kind: Kustomization
      name: cluster-stack
    - kind: Kustomization
      name: infra-base
    - kind: Kustomization
      name: infra-traefik
    - kind: Kustomization
      name: infra-cert-manager
    - kind: Kustomization
      name: infra-issuers
    - kind: Kustomization
      name: platform-oauth2-proxy
    - kind: Kustomization
      name: platform-clickstack-operators
    - kind: Kustomization
      name: platform-clickstack
    - kind: Kustomization
      name: platform-otel
    - kind: Kustomization
      name: platform-reloader
    - kind: Kustomization
      name: platform-flux-webhook
    - kind: Kustomization
      name: platform-image-automation
    - kind: Kustomization
      name: platform-alerts
    - kind: GitRepository
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'
