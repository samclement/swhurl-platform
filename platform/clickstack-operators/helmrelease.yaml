# MongoDB (MCK) and ClickHouse operators with their CRDs, installed before the
# clickstack release that creates MongoDBCommunity, ClickHouseCluster and
# KeeperCluster resources. Cluster-scoped: CRDs and ClusterRoles.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack-operators
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  releaseName: clickstack-operators
  chart:
    spec:
      chart: clickstack-operators
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
