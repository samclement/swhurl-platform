apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: clickstack
  valuesFrom:
    - kind: Secret
      name: clickstack-runtime-inputs
      valuesKey: CLICKSTACK_API_KEY
      targetPath: hyperdx.apiKey
      optional: false
  chart:
    spec:
      chart: clickstack
      version: 3.4.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: clickstack-clickhouse
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: system-log-ttl
                  configMap:
                    name: clickhouse-system-log-ttl
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: system-log-ttl
                  mountPath: /etc/clickhouse-server/config.d/system-log-ttl.xml
                  subPath: system-log-ttl.xml
                  readOnly: true
  values:
    global:
      storageClassName: local-path
      # helm.sh/resource-policy: keep on all ClickStack PVCs, so a Helm
      # uninstall cannot delete MongoDB configuration or ClickHouse data.
      keepPVC: true
    clickhouse:
      persistence:
        enabled: true
        dataSize: 20Gi
        logSize: 5Gi
      prometheus:
        enabled: false
    mongodb:
      persistence:
        enabled: true
        dataSize: 10Gi
    hyperdx:
      frontendUrl: https://clickstack.${BASE_DOMAIN}
      ingress:
        enabled: true
        ingressClassName: traefik
        host: clickstack.${BASE_DOMAIN}
        path: /
        pathType: Prefix
        annotations:
          cert-manager.io/cluster-issuer: "${CERT_ISSUER}"
        tls:
          enabled: true
          secretName: clickstack-tls
    otel:
      enabled: true
