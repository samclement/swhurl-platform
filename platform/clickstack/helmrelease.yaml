# ClickStack: HyperDX app, its OTel collector, and operator-managed MongoDB and
# ClickHouse (see platform/clickstack-operators). The first account and the team
# ingestion key are set by `make clickstack-bootstrap`, not by the chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: clickstack
  valuesFrom:
    # The app sends its own logs with the team ingestion key.
    - kind: Secret
      name: clickstack-runtime-inputs
      valuesKey: CLICKSTACK_INGESTION_KEY
      targetPath: hyperdx.secrets.HYPERDX_API_KEY
    - kind: Secret
      name: clickstack-runtime-inputs
      valuesKey: MONGODB_PASSWORD
      targetPath: hyperdx.secrets.MONGODB_PASSWORD
    - kind: Secret
      name: clickstack-runtime-inputs
      valuesKey: CLICKHOUSE_PASSWORD
      targetPath: hyperdx.secrets.CLICKHOUSE_PASSWORD
    - kind: Secret
      name: clickstack-runtime-inputs
      valuesKey: CLICKHOUSE_APP_PASSWORD
      targetPath: hyperdx.secrets.CLICKHOUSE_APP_PASSWORD
  chart:
    spec:
      chart: clickstack
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    hyperdx:
      config:
        FRONTEND_URL: https://clickstack.${BASE_DOMAIN}
        # HyperDX traces itself: about 12,900 spans an hour, nearly every one a request to its own API or
        # health path, written as thousands of tiny inserts a day. Keep one trace in ten (the decision is
        # made per trace, so a kept trace is whole); raise the ratio to look closer at HyperDX itself.
        OTEL_TRACES_SAMPLER: parentbased_traceidratio
        OTEL_TRACES_SAMPLER_ARG: "0.1"
        # The collector also reads this ConfigMap. Each batch it flushes becomes a ClickHouse part, and with
        # few parts in a daily partition the merge selector rewrites the day's growing part (1M+ metric rows)
        # every five new parts. Flushing every 30 s instead of 5 s cuts those rewrites about fivefold, for
        # telemetry that arrives up to 30 s later.
        HYPERDX_OTEL_BATCH_TIMEOUT: 30s
      deployment:
        # The chart does not restart the app or the collector when hyperdx.config changes (no checksum) and
        # Reloader does not watch observability: change this value, and the collector's below, with any change
        # to hyperdx.config to roll both pods from Git.
        podAnnotations:
          platform.swhurl.com/config-revision: "2"
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_ISSUER}
          # Google sign-in in front of HyperDX's own login; also keeps first-user
          # registration unreachable from outside before the bootstrap runs.
          traefik.ingress.kubernetes.io/router.middlewares: ingress-oauth-auth-shared@kubernetescrd
        spec:
          ingressClassName: traefik
          rules:
            - host: clickstack.${BASE_DOMAIN}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: clickstack-app
                        port:
                          number: 3000
          tls:
            - hosts:
                - clickstack.${BASE_DOMAIN}
              secretName: clickstack-tls
    otel-collector:
      # Merged with the chart's checksum/custom-config annotation.
      podAnnotations:
        platform.swhurl.com/config-revision: "2"
    mongodb:
      spec:
        statefulSet:
          spec:
            template:
              spec:
                containers:
                  # The operator's default 500M limit OOM-killed mongod three times in 34 days, once while
                  # HyperDX and its collector restarted. WiredTiger sizes its cache from this limit (256 MB at
                  # both), so the rest is headroom for connections and queries.
                  - name: mongod
                    resources:
                      requests:
                        cpu: 500m
                        memory: 400M
                      limits:
                        cpu: "1"
                        memory: 1Gi
            volumeClaimTemplates:
              # Irreplaceable (team, users, sources): the volume outlives its claim.
              - metadata:
                  name: data-volume
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: local-path-retain
                  resources:
                    requests:
                      storage: 10Gi
    clickhouse:
      cluster:
        spec:
          containerTemplate:
            resources:
              limits:
                # The chart's 2Gi is below what ClickHouse used on this node (1.9Gi). 8Gi gives the server a
                # 7.2 GiB accounting cap, enough for the merges of metric_log's ~1,350 columns that a 4Gi
                # limit killed at 3.6 GiB. A limit reserves nothing: the request stays at 2Gi.
                memory: 8Gi
          settings:
            extraConfig:
              # Capped so the cache cannot grow into the room the merges need; metric_log is small, and the
              # 5 GiB default could never fill under the old limit anyway.
              mark_cache_size: 2147483648
              # Merged with the chart's ttl. metric_log has ~1,350 columns: a
              # horizontal merge into a Wide part needs more than the 3.6 GiB
              # server limit and retries forever; vertical merges one column at a time.
              # Even vertical merges of a month (2M rows) exceed it, and so does the
              # rewrite that applies the TTL: daily partitions bound every merge to
              # a day and ttl_only_drop_parts drops an expired day without reading it.
              # Each flush is a part, and the default 7.5 s flush kept re-merging the
              # day's part as new ones arrived; flushing a minute at a time cuts that
              # eightfold, for ClickHouse's own metrics arriving up to 60 s late.
              # A day's part is 20 to 28 MiB, under the 10 MiB that would make it Wide, so
              # merges run horizontally over all ~1,350 columns at once: on 6 November one
              # such merge asked for over 3.6 GiB, failed, and retried every 0.4 s until it
              # starved every other query. Keeping the parts Compact is deliberate: forcing
              # Wide parts (min_bytes_for_wide_part = 0) makes each write allocate a
              # compression buffer per column, about 3.6 GiB for one 60-row flush, and then
              # nothing can be written at all. The memory limit is the lever, not the layout.
              metric_log:
                partition_by: toYYYYMMDD(event_date)
                settings: vertical_merge_algorithm_min_rows_to_activate = 1, ttl_only_drop_parts = 1
                flush_interval_milliseconds: 60000
              asynchronous_metric_log:
                flush_interval_milliseconds: 60000
          dataVolumeClaimSpec:
            resources:
              requests:
                storage: 20Gi
