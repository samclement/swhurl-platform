# The console image is published by .github/workflows/publish-console.yml. To
# deploy the image for the current commit: make console-image (pins the
# src-<hash of the image's inputs> tag and its digest), commit, push.
# make verify-platform warns when the inputs have changed since the pinned image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: console
  namespace: console
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The app hardening, except that the console mounts its read-only
    # ServiceAccount's token (platform/console/rbac.yaml).
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        forceRename: console
        # The chart creates this ServiceAccount; rbac.yaml binds it.
        serviceAccount:
          name: console
        # Restart when the GitHub token changes (namespace console is in platform-reloader's list).
        annotations:
          secret.reloader.stakater.com/reload: console-github
        containers:
          main:
            image: &operator-image
              repository: ghcr.io/samclement/swhurl-console
              tag: src-deeee76b01214af2
              digest: sha256:c829f2d4a8b193b15790ac8bea092dff4c4fa0bdc6c69adca3a3319b5a687121
            env:
              CONSOLE_REPO: samclement/swhurl-platform
            # GITHUB_TOKEN: create console/* branches and open PRs; APP_REPOS_TOKEN: create new app
            # repositories (secret.sops.yaml; docs/console.md#github-tokens).
            envFrom:
            - secretRef:
                name: console-github
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
      dashboards:
        type: cronjob
        serviceAccount:
          name: dashboard-sync
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 30
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
        containers:
          main:
            image: *operator-image
            command: [timeout, "50", python, -m, swhurl, clickstack-dashboards, --cluster]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
        - path: /tmp
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_ISSUER}
          traefik.ingress.kubernetes.io/router.middlewares: ingress-oauth-auth-shared@kubernetescrd
        hosts:
        - host: console.${BASE_DOMAIN}
          paths:
          - path: /
            service:
              identifier: main
              port: http
        tls:
        - hosts:
          - console.${BASE_DOMAIN}
          secretName: console-tls
