# The console image is published by .github/workflows/publish-console.yml; to
# deploy a new one, copy the tag (commit SHA) and index digest from that run's
# summary. make verify-platform warns when the tooling has changed since the tag.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: console
  namespace: console
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The app hardening, except that the console mounts its read-only
    # ServiceAccount's token (platform/console/rbac.yaml).
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        # The chart creates this ServiceAccount; rbac.yaml binds it.
        serviceAccount:
          name: console
        # Restart when the GitHub token changes (namespace console is in platform-reloader's list).
        annotations:
          secret.reloader.stakater.com/reload: console-github
        containers:
          main:
            image:
              repository: ghcr.io/samclement/swhurl-console
              tag: 9364c77b4228b0f9caf98a68bedbb71a0c4e5e5d
              digest: sha256:d0111ad407652ba1b5fecd89bc0f9c7278b6d1e02346dd598816bd88f7f3be81
            env:
              CONSOLE_REPO: samclement/swhurl-platform
            # GITHUB_TOKEN: push console/* branches and open PRs (secret.sops.yaml).
            envFrom:
            - secretRef:
                name: console-github
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
        - path: /tmp
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_ISSUER}
          traefik.ingress.kubernetes.io/router.middlewares: ingress-oauth-auth-shared@kubernetescrd
        hosts:
        - host: console.${BASE_DOMAIN}
          paths:
          - path: /
            service:
              identifier: main
              port: http
        tls:
        - hosts:
          - console.${BASE_DOMAIN}
          secretName: console-tls
