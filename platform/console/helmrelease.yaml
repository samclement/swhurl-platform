# The console image is published and pinned by .github/workflows/validate.yml. To
# deploy the image for the current commit: make console-image (pins the
# src-<hash of the image's inputs> tag and its digest), commit, push.
# make verify-platform warns when the inputs have changed since the pinned image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: console
  namespace: console
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The app hardening, except that the console mounts its read-only
    # ServiceAccount's token (platform/console/rbac.yaml).
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        forceRename: console
        # The chart creates this ServiceAccount; rbac.yaml binds it.
        serviceAccount:
          name: console
        # Restart when the GitHub token or the NATS key changes (namespace console is in platform-reloader's list).
        annotations:
          secret.reloader.stakater.com/reload: console-github,console-nats
        # A pod being replaced finishes its running jobs first (the longest waits ten minutes for an
        # app's first build, then opens a pull request); actions.DRAIN stays inside this.
        pod:
          terminationGracePeriodSeconds: 900
        containers:
          main:
            image: &operator-image
              repository: ghcr.io/samclement/swhurl-console
              tag: src-5be67369345465f6
              digest: sha256:406f6218dcadbac12542fcd7fa928e2df277d20eea5cb9f2ed0994c76ae5e7c7
            env:
              CONSOLE_REPO: samclement/swhurl-platform
            # GITHUB_TOKEN: create console/* branches and open PRs; APP_REPOS_TOKEN: create new app
            # repositories; IMAGE_WEBHOOK_TOKEN: sign the image webhook added to them
            # (secret.sops.yaml; docs/console.md#github-tokens). NATS_SEED: write feature flag
            # overrides (nats.sops.yaml; docs/apps.md#feature-flags).
            envFrom:
            - secretRef:
                name: console-github
            - secretRef:
                name: console-nats
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  # The console starts in about a second and the old pod is gone by then: every 2 s
                  # rather than the default 10 s keeps the gap in a deploy short.
                  periodSeconds: 2
                  httpGet:
                    path: /healthz
                    port: 8080
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
      dashboards:
        type: cronjob
        serviceAccount:
          name: dashboard-sync
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 30
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
        containers:
          main:
            image: *operator-image
            command: [timeout, "50", python, -m, swhurl, clickstack-dashboards, --cluster]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
      notifications:
        type: cronjob
        serviceAccount:
          name: notification-check
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 30
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
        containers:
          main:
            image: *operator-image
            command: [timeout, "50", python, -m, swhurl, notifications-check]
            env:
              CONSOLE_URL: https://console.${BASE_DOMAIN}
              # Messages about apps also go to the notify service, which sends them to the app's
              # team; the token below says who is sending (docs/services.md#notify-service).
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: notification-ntfy
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
        - path: /tmp
      # The checker's token for the notify service: valid for that audience only, so the Kubernetes
      # API and every other service refuse it.
      notify-token:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: token
        advancedMounts:
          notifications:
            main:
            - path: /var/run/swhurl/tokens/notify
              readOnly: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_ISSUER}
          traefik.ingress.kubernetes.io/router.middlewares: ingress-oauth-auth-shared@kubernetescrd
        hosts:
        - host: console.${BASE_DOMAIN}
          paths:
          - path: /
            service:
              identifier: main
              port: http
        tls:
        - hosts:
          - console.${BASE_DOMAIN}
          secretName: console-tls
