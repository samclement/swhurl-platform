# What the console's ServiceAccount (console/console, created by the HelmRelease
# because its pod names it) may do. Read: only the objects its pages show; never
# Secrets or pods/exec. Write: patch Flux units and Git sources in flux-system,
# for reconcile (requestedAt annotation), suspend and resume (spec.suspend). RBAC
# cannot limit which fields a patch changes; the console only sends those
# patches and refuses the root units (tools/swhurl/console/actions.py).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-console-read
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-console-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-console-read
subjects:
  - kind: ServiceAccount
    name: console
    namespace: console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-operate
  namespace: flux-system
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-operate
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-console-operate
subjects:
  - kind: ServiceAccount
    name: console
    namespace: console
