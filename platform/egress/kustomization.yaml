# The proxy's own configuration is v2's: `swhurl-v2 proxy` renders configmap.json (Squid's configuration and
# the Service's ports, as values the HelmRelease reads) and networkpolicy.json (each port admitted from its
# instance's namespace) from allocation.json, which pins one port per instance (docs/services.md#egress-proxy).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.json
  - networkpolicy.json
  - helmrelease.yaml
