# Generated by make app-sync from the instances under apps/: do not edit.
# Each port is kept in its instance's HTTPS_PROXY variable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy
  namespace: egress
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    configMaps:
      config:
        data:
          squid.conf: |
            # Squid, one port per app instance; every request is logged with the instance that sent it,
            # and whether a grant (make app-egress) covers it.
            pid_filename none
            pinger_enable off
            cache deny all
            via off
            forwarded_for delete
            shutdown_lifetime 3 seconds
            logformat egress instance=%{instance}note granted=%{granted}note client=%>a method=%rm host=%>rd:%>rP status=%>Hs/%Ss bytes=%<st ms=%tr
            http_port 3128 name=health
            acl health myportname health
            http_access deny health
            # Requests only: the kubelet's probes connect every few seconds and send none.
            acl request has request
            access_log stdio:/dev/stdout logformat=egress request
            cache_log stdio:/dev/stderr
            http_port 30101 name=demo-notifier-staging
            acl demo-notifier-staging myportname demo-notifier-staging
            note instance demo-notifier-staging demo-notifier-staging
            http_port 30102 name=demo-orders-staging
            acl demo-orders-staging myportname demo-orders-staging
            note instance demo-orders-staging demo-orders-staging
            http_port 30103 name=demo-shop-staging
            acl demo-shop-staging myportname demo-shop-staging
            note instance demo-shop-staging demo-shop-staging
            http_port 30104 name=demo-shopper-staging
            acl demo-shopper-staging myportname demo-shopper-staging
            note instance demo-shopper-staging demo-shopper-staging
            http_port 30105 name=swhurl-try-10-staging
            acl swhurl-try-10-staging myportname swhurl-try-10-staging
            note instance swhurl-try-10-staging swhurl-try-10-staging
            http_port 30106 name=swhurl-try-11-staging
            acl swhurl-try-11-staging myportname swhurl-try-11-staging
            note instance swhurl-try-11-staging swhurl-try-11-staging
            http_port 30107 name=swhurl-try-12-staging
            acl swhurl-try-12-staging myportname swhurl-try-12-staging
            note instance swhurl-try-12-staging swhurl-try-12-staging
            http_port 30108 name=swhurl-try-13-staging
            acl swhurl-try-13-staging myportname swhurl-try-13-staging
            note instance swhurl-try-13-staging swhurl-try-13-staging
            http_port 30109 name=swhurl-try-17-staging
            acl swhurl-try-17-staging myportname swhurl-try-17-staging
            note instance swhurl-try-17-staging swhurl-try-17-staging
            http_port 30110 name=swhurl-try-18-staging
            acl swhurl-try-18-staging myportname swhurl-try-18-staging
            note instance swhurl-try-18-staging swhurl-try-18-staging
            http_port 30111 name=demo-orders-prod
            acl demo-orders-prod myportname demo-orders-prod
            note instance demo-orders-prod demo-orders-prod
            http_port 30112 name=demo-shop-prod
            acl demo-shop-prod myportname demo-shop-prod
            note instance demo-shop-prod demo-shop-prod
            http_port 30113 name=swhurl-try-10-prod
            acl swhurl-try-10-prod myportname swhurl-try-10-prod
            note instance swhurl-try-10-prod swhurl-try-10-prod
            http_port 30114 name=swhurl-try-11-prod
            acl swhurl-try-11-prod myportname swhurl-try-11-prod
            note instance swhurl-try-11-prod swhurl-try-11-prod
            http_port 30115 name=swhurl-try-12-prod
            acl swhurl-try-12-prod myportname swhurl-try-12-prod
            note instance swhurl-try-12-prod swhurl-try-12-prod
            http_port 30116 name=swhurl-try-19-staging
            acl swhurl-try-19-staging myportname swhurl-try-19-staging
            note instance swhurl-try-19-staging swhurl-try-19-staging
            # Every host for now: refusing what no grant covers comes later.
            http_access allow all
    service:
      main:
        ports:
          p30101:
            port: 30101
          p30102:
            port: 30102
          p30103:
            port: 30103
          p30104:
            port: 30104
          p30105:
            port: 30105
          p30106:
            port: 30106
          p30107:
            port: 30107
          p30108:
            port: 30108
          p30109:
            port: 30109
          p30110:
            port: 30110
          p30111:
            port: 30111
          p30112:
            port: 30112
          p30113:
            port: 30113
          p30114:
            port: 30114
          p30115:
            port: 30115
          p30116:
            port: 30116
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-port-per-instance
  namespace: egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: egress
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-notifier-staging
    ports:
    - port: 30101
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-orders-staging
    ports:
    - port: 30102
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-shop-staging
    ports:
    - port: 30103
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-shopper-staging
    ports:
    - port: 30104
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-10-staging
    ports:
    - port: 30105
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-11-staging
    ports:
    - port: 30106
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-12-staging
    ports:
    - port: 30107
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-13-staging
    ports:
    - port: 30108
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-17-staging
    ports:
    - port: 30109
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-18-staging
    ports:
    - port: 30110
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-orders-prod
    ports:
    - port: 30111
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: demo-shop-prod
    ports:
    - port: 30112
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-10-prod
    ports:
    - port: 30113
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-11-prod
    ports:
    - port: 30114
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-12-prod
    ports:
    - port: 30115
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swhurl-try-19-staging
    ports:
    - port: 30116
