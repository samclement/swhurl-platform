# When an app's staging ImagePolicy reports its newest image, start the Deploy workflow
# (.github/workflows/deploy.yml), which writes the tag, digest and offers in one commit
# (docs/apps.md#deploy-a-new-image). The token is the console's GITHUB_TOKEN, fine-grained for this
# repository alone; repository_dispatch needs its Contents: read and write (dispatch-secret.sops.yaml;
# rotate both copies together: docs/operations.md#secrets).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-dispatch
  namespace: flux-system
spec:
  type: githubdispatch
  address: https://github.com/samclement/swhurl-platform
  secretRef:
    name: github-dispatch
---
# A policy reports its image at every reconcile, not only on a change; the workflow's first job
# ends a run for an image staging already runs.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: image-dispatch
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: info
  inclusionList:
    - '^Latest image tag for .* resolved to '
  eventSources:
    - kind: ImagePolicy
      name: '*'
      matchLabels:
        platform.swhurl.com/managed: 'true'
