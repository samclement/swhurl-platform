# Rewrites the image tag and digest lines marked {"$imagepolicy": "flux-system:<app>-staging:..."}
# under apps/ when an app's ImagePolicy (written by make app-new --auto-deploy) finds a newer image,
# and pushes the commit to main; the push webhook then has Flux deploy it. Only staging instances
# carry markers; production changes through make app-promote (docs/apps.md#deploy-a-new-image).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps-staging
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform-write
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        deploy: staging images (image automation)
        {{ range .Changed.Changes }}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{- end }}
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters
