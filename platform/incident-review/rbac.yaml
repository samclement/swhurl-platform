# The reviewer's only Kubernetes rights: read and patch its own state, and list HelmReleases
# for the image tag of the allowlisted app. No Secrets, no exec, no workload verbs. The pod
# does not automount this account's token; helmrelease.yaml mounts it into collect and decide only.
# The chart creates the ServiceAccount (incident-review); this file binds it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-review-state
  namespace: incident-review
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [incident-review-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-review-state
  namespace: incident-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-review-state
subjects:
  - kind: ServiceAccount
    name: incident-review
    namespace: incident-review
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-incident-review-read
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-incident-review-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-incident-review-read
subjects:
  - kind: ServiceAccount
    name: incident-review
    namespace: incident-review
