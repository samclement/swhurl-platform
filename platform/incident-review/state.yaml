# Flux owns the object metadata, never data.state.json. The reviewer's decide step owns that
# field (incidents, baselines, spend, outbox), so reconciliation preserves it. Disposable: a
# lost state repeats at most one diagnosis per incident and restarts the monthly spend count.
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-review-state
  namespace: incident-review
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
