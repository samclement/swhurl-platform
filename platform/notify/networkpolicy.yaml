# Only the notification checker, app instances and ClickStack (its alert webhook) may connect; anything
# else is refused before it reaches the service, which then checks the caller's token or the webhook's
# secret as well. Health probes come from the node and are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notify-only-from-senders
  namespace: notify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: notify
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: console
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: console
              app.kubernetes.io/controller: notifications
        # ClickStack's app, which sends the alert webhook.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: clickstack
        # Every app instance: its namespace carries the app label (apps/<app>/<env>/namespace.yaml).
        - namespaceSelector:
            matchExpressions:
              - key: platform.swhurl.com/app
                operator: Exists
      ports:
        - port: 8080
