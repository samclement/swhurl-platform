apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-k8s-cluster
  namespace: logging
spec:
  interval: 30m
  releaseName: otel-k8s-cluster
  dependsOn:
    - name: otel-k8s-daemonset
      namespace: logging
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.175.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Restart when the ingestion key Secret changes (platform-reloader).
    annotations:
      secret.reloader.stakater.com/reload: clickstack-ingestion-key
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-k8s
    presets:
      kubernetesEvents:
        enabled: true
      clusterMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      receivers:
        # The clusterMetrics preset scrapes every 10 s: about a third of all metric rows (replica sets, pods,
        # containers), mostly unchanged between scrapes. A minute is plenty for cluster state graphs.
        k8s_cluster:
          collection_interval: 60s
      processors:
        transform/events:
          error_mode: silent
          log_statements:
          - context: log
            statements:
            - set(cache["event"], body)
            - set(cache["event"], body["object"]) where IsMap(body["object"])
            - set(attributes["log.parser"], "k8s-event")
            - set(severity_number, 13) where severity_number == 0 and cache["event"]["type"] == "Warning"
            - set(severity_number, 9) where severity_number == 0 and cache["event"]["type"] == "Normal"
            - set(severity_text, "WARN") where severity_text == "" and severity_number == 13
            - set(severity_text, "INFO") where severity_text == "" and severity_number == 9
            - set(attributes["log.record.original"], String(body)) where attributes["log.record.original"] == nil
            - set(body, cache["event"]["message"]) where IsString(cache["event"]["message"])
            - set(body, cache["event"]["note"]) where IsString(cache["event"]["note"]) and not IsString(cache["event"]["message"])
            - flatten(cache["event"], "k8s.event", resolveConflicts=true)
            - merge_maps(attributes, cache["event"], "insert")
            conditions:
            - IsMap(body)
      exporters:
        otlp_http:
          endpoint: http://clickstack-otel-collector.observability.svc.cluster.local:4318
          headers:
            authorization: "${env:CLICKSTACK_INGESTION_KEY}"
      service:
        telemetry:
          logs:
            encoding: json
        pipelines:
          logs:
            receivers:
              - k8sobjects
            processors:
              - memory_limiter
              - transform/events
              - k8s_attributes
              - batch
            exporters:
              - otlp_http
          metrics:
            receivers:
              - k8s_cluster
            processors:
              - memory_limiter
              - k8s_attributes
              - batch
            exporters:
              - otlp_http
    extraEnvs:
      - name: CLICKSTACK_INGESTION_KEY
        valueFrom:
          secretKeyRef:
            name: clickstack-ingestion-key
            key: CLICKSTACK_INGESTION_KEY
    clusterRole:
      create: true
