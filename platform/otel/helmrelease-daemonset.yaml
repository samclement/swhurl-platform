apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-k8s-daemonset
  namespace: logging
spec:
  interval: 30m
  releaseName: otel-k8s-daemonset
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.174.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Restart when the ingestion key Secret changes (platform-reloader).
    annotations:
      secret.reloader.stakater.com/reload: clickstack-ingestion-key
    mode: daemonset
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    image:
      repository: otel/opentelemetry-collector-k8s
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: true
      kubeletMetrics:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      receivers:
        kubeletstats:
          endpoint: 127.0.0.1:10250
          insecure_skip_verify: true
        # Host systemd timers (make host-backup, make host-dns) append their output
        # to /var/log/swhurl-platform/<unit>.log; the file name becomes service.name
        # and [ERROR]/[BAD]/[WARN]/[INFO]/[OK] prefixes become severities.
        file_log/host-timers:
          include:
            - /hostfs/var/log/swhurl-platform/*.log
          start_at: end
          include_file_name: true
          operators:
            - type: regex_parser
              id: service
              parse_from: attributes["log.file.name"]
              regex: '^(?P<service>[a-z0-9-]+)\.log$'
            - type: move
              from: attributes.service
              to: resource["service.name"]
            - type: regex_parser
              id: level
              if: 'body matches "^\\[(HOST\\]\\[)?(OK|INFO|WARN|BAD|ERROR)\\]"'
              regex: '^\[(?:HOST\]\[)?(?P<level>OK|INFO|WARN|BAD|ERROR)\]'
              severity:
                parse_from: attributes.level
                mapping:
                  error: [ERROR, BAD]
                  warn: WARN
                  info: [INFO, OK]
            - type: remove
              if: 'attributes.level != nil'
              field: attributes.level
      exporters:
        otlp_http:
          endpoint: http://clickstack-otel-collector.observability.svc.cluster.local:4318
          headers:
            authorization: "${env:CLICKSTACK_INGESTION_KEY}"
      service:
        pipelines:
          logs:
            receivers:
              - otlp
              - file_log
              - file_log/host-timers
            processors:
              - memory_limiter
              - k8s_attributes
              - batch
            exporters:
              - otlp_http
          metrics:
            receivers:
              - kubeletstats
              - hostmetrics
            processors:
              - memory_limiter
              - k8s_attributes
              - batch
            exporters:
              - otlp_http
    extraEnvs:
      - name: CLICKSTACK_INGESTION_KEY
        valueFrom:
          secretKeyRef:
            name: clickstack-ingestion-key
            key: CLICKSTACK_INGESTION_KEY
    clusterRole:
      create: true
