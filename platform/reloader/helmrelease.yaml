# Restarts opted-in workloads when a named Secret changes. Scoped mode: it
# watches only the namespaces in the values ConfigMap beside this file and gets
# namespaced Roles there, not cluster-wide Secret access. That list is v2's
# output (platform/reloader/values.json, make v2-reloader): the platform's own
# namespaces from the profile and one per instance that declares a Secret.
# Workloads opt in per Secret with
#   secret.reloader.stakater.com/reload: "<secret-name>"
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: platform-system
spec:
  interval: 30m
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.19
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The watched namespaces are one document v2 renders, not a list here: the platform's own namespaces are the
  # profile's, and an instance's is watched when it declares a Secret a change must restart it for. Helm merges
  # the ConfigMap as values, so a record change reaches this release without an edit to this file.
  valuesFrom:
    - kind: ConfigMap
      name: reloader-values
      valuesKey: values.yaml
  values:
    reloader:
      logFormat: json
      watchGlobally: false
      ignoreConfigMaps: true
      # Patch a pod-template annotation rather than injecting env vars.
      reloadStrategy: annotations
      readOnlyRootFileSystem: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
