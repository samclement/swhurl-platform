# Not a distributable package: uv locks the one Python runtime tool, Copier.
[project]
name = "swhurl-platform"
version = "0"
requires-python = ">=3.11"

[tool.uv]
package = false
default-groups = ["copier"]

# The code graph development aid and its tests use only the standard library.
# Lint with: uvx ruff@0.16.9 check devtools
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["codegraph"]

[dependency-groups]
copier = ["copier==9.18.2"]
