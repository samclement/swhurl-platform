apiVersion: v1
kind: Secret
metadata:
  name: smoke-data-backup
  namespace: smoke-data-prod
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: smoke-data-backup
  namespace: smoke-data-prod
  labels:
    platform.swhurl.com/backup: 'true'
spec:
  schedule: 44 3 * * *
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            platform.swhurl.com/backup: 'true'
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/samclement/swhurl-backup:src-05b9898196028050@sha256:bfe284ede5bfa59cb04b33459bb73c4501298ead7c11a77819051ccfffa7af1a
            args:
            - backup-job-sqlite
            env:
            - name: AGE_RECIPIENT
              value: age1u79dp6zjkal33l7rguzqxy66rwykhq90msrw47tf0vy4mu2jh3hsrkmn7h
            - name: BACKUP_S3_URI
              value: s3://swhurl-platform-backups-110927251694/app-sqlite/smoke-data-prod/
            - name: BACKUP_SOURCE
              value: smoke-data-prod/smoke-data
            - name: DATABASE_PATH
              value: /data/app.db
            envFrom:
            - secretRef:
                name: smoke-data-backup
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: smoke-data
          - name: scratch
            emptyDir:
              sizeLimit: 1Gi
          - name: tmp
            emptyDir: {}
