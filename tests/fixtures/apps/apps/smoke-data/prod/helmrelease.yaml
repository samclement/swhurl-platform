apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smoke-data
  namespace: smoke-data-prod
  annotations:
    platform.swhurl.com/secrets: GREETING
    platform.swhurl.com/render: 88ee188095fb2ec7379c0c7f6ca6a5a8f0de33bbabb2fe9dc9eeb6307d35aecf
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/busybox
              tag: '1.37'
              digest: sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            command:
            - sh
            - -c
            - date -u >> /data/log; exec sleep 3600000
            env:
              SWHURL_APP: smoke-data
              SWHURL_ENV: prod
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
              DATABASE_PATH: /data/app.db
            envFrom:
            - secretRef:
                name: smoke-data-secret
                optional: true
        annotations:
          secret.reloader.stakater.com/reload: smoke-data-secret
        replicas: 1
        strategy: Recreate
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      data:
        type: persistentVolumeClaim
        storageClass: local-path-retain
        accessMode: ReadWriteOnce
        size: 64Mi
        retain: true
        globalMounts:
        - path: /data
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
