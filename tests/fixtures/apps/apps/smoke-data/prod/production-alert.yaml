apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: app-smoke-data-production
  namespace: flux-system
spec:
  providerRef:
    name: ntfy-deploys
  eventSeverity: info
  eventSources:
  - kind: HelmRelease
    name: smoke-data
    namespace: smoke-data-prod
  inclusionList:
  - .*succeeded.*
