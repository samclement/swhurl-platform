apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smoke-worker
  namespace: smoke-worker-staging
  annotations:
    platform.swhurl.com/render: 8c3d19c443832f3be4c673a06bdbf40a0dc47262f007800e08205c505523c4e5
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/busybox
              tag: '1.37'
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            command:
            - sleep
            - '3600000'
            env:
              SWHURL_APP: smoke-worker
              SWHURL_ENV: staging
              SWHURL_NOTIFY_URL: http://notify.notify.svc.cluster.local:8080
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      tokens:
        type: projected
        sources:
        - serviceAccountToken:
            audience: notify
            expirationSeconds: 600
            path: notify/token
        globalMounts:
        - path: /var/run/swhurl/tokens
          readOnly: true
