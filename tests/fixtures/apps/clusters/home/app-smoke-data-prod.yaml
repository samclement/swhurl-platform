apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-app-smoke-data-prod
  namespace: flux-system
spec:
  dependsOn:
  - name: homelab-cluster-base
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./tenants/apps/smoke-data/prod
  prune: true
  wait: true
  timeout: 10m
