apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-smoke-web-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-base
  - name: platform-oauth2-proxy
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./apps/smoke-web/staging
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  wait: true
  timeout: 10m
