apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-app-smoke-web-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: homelab-cluster-base
  - name: homelab-auth
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./tenants/apps/smoke-web/staging
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  wait: true
  timeout: 10m
