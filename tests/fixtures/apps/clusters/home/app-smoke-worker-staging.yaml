apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-app-smoke-worker-staging
  namespace: flux-system
spec:
  dependsOn:
  - name: homelab-cluster-base
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: swhurl-platform
  path: ./tenants/apps/smoke-worker/staging
  prune: true
  wait: true
  timeout: 10m
