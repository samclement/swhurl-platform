# Disposable live proof for make suspend/resume (docs/iteration-2-plan.md section 32). No storage or service.
apiVersion: v1
kind: Namespace
metadata:
  name: suspend-resume-test
  labels:
    platform.swhurl.com/suspend-resume-test: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: suspend-resume-test
  namespace: suspend-resume-test
  labels:
    platform.swhurl.com/suspend-resume-test: "true"
spec:
  interval: 10m
  timeout: 3m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        containers:
          main:
            image:
              repository: docker.io/library/busybox
              tag: "1.37"
            command: ["sleep", "3600000"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            resources:
              requests: {cpu: 1m, memory: 8Mi}
              limits: {memory: 16Mi}
