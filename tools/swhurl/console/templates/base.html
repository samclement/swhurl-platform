<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Console{% endblock %} · swhurl</title>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e2e2dc;
    --ok: #1f7a4d; --bad: #b3261e; --warn: #8a5a00; --off: #6b6b66; --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecece8; --muted: #9a9a93; --line: #33332f;
      --ok: #5cc98f; --bad: #ff8a80; --warn: #e0b04f; --off: #9a9a93; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; }
  nav a { margin-right: 16px; color: var(--muted); text-decoration: none; }
  nav a.here { color: var(--text); font-weight: 600; }
  header .who { color: var(--muted); font-size: 13px; }
  header .button { margin-left: auto; }
  .badge { font-size: 12px; font-weight: 600; color: var(--warn); border: 1px solid currentColor; border-radius: 10px; padding: 0 6px; margin-left: 4px; }
  a.button { display: inline-block; text-decoration: none; border-radius: 4px; padding: 4px 12px; font-size: 14px; }
  a.button.primary { background: var(--accent); color: var(--panel); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .off { color: var(--off); }
  .muted { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; background: var(--panel);
       border: 1px solid var(--line); padding: 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  dl.promotion-review { grid-template-columns: max-content minmax(0, 1fr); }
  dl.promotion-review dd { min-width: 0; overflow-wrap: anywhere; }
  .promotion-form { margin-top: 12px; }
  @media (max-width: 600px) {
    dl.promotion-review { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    dl.promotion-review dt:not(:first-child) { margin-top: 8px; }
  }
  form.actions { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-size: 13px; padding: 2px 10px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.risky { color: var(--warn); }
  /* New app form (new.html): one column, label above field, so opening Advanced cannot shift anything. */
  .lead { color: var(--muted); max-width: 60em; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 8px; }
  .tabs a { padding: 6px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a.here { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .new-app { display: grid; grid-template-columns: minmax(0, 38em) minmax(0, 22em); gap: 24px; align-items: start; margin-top: 16px; }
  @media (max-width: 900px) { .new-app { grid-template-columns: minmax(0, 1fr); } }
  form.wizard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; }
  form.wizard fieldset { border: 0; margin: 0 0 20px; padding: 0; min-width: 0; }
  form.wizard legend { font-weight: 600; padding: 0; margin-bottom: 8px; }
  form.wizard .field { margin-bottom: 12px; }
  form.wizard .field > label:not(.check), form.wizard .label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  form.wizard input:not([type=checkbox]):not([type=radio]), form.wizard select {
    font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--text); }
  form.wizard input:focus-visible, form.wizard select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form.wizard .hint { display: block; margin: 4px 0 0; }
  form.wizard [hidden] { display: none; }
  form.wizard .check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .segmented label { padding: 6px 14px; cursor: pointer; }
  .segmented label + label { border-left: 1px solid var(--line); }
  .segmented label:has(input:checked) { background: var(--bg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
            border: 1px solid var(--line); border-radius: 6px; }
  .choice input { margin-top: 4px; }
  .choice:has(input:checked) { border-color: var(--accent); }
  form.wizard .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  form.wizard .pair .field:has(.check) { grid-column: 1 / -1; }
  @media (max-width: 600px) { form.wizard .pair { grid-template-columns: minmax(0, 1fr); } }
  details.advanced { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 16px; }
  details.advanced > summary { cursor: pointer; font-weight: 600; margin-bottom: 12px; }
  form.wizard .submit { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-size: 14px; font-weight: 600; padding: 6px 16px; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26em), 1fr)); gap: 16px; align-items: start; max-width: 62em; margin-bottom: 12px; }
  aside.summary { position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
  aside.summary h2 { margin-top: 0; }
  aside.summary dd { min-width: 0; overflow-wrap: anywhere; }
  dl.plain { background: none; border: 0; padding: 0; gap: 4px 12px; }
  /* Overview, Platform, unit and Activity pages. A status mark pairs colour with a shape. */
  .verdict { font-size: 17px; margin: 0 0 4px; }
  .tabs + .verdict { margin-top: 16px; }
  .scenarios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
  @media (max-width: 600px) { .scenarios { grid-template-columns: minmax(0, 1fr); } }
  .scenarios a { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line);
                 border-radius: 6px; background: var(--panel); color: var(--text); text-decoration: none; }
  .scenarios a.here { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .scenarios .produces { font-size: 0.9em; }
  .mark { display: inline-block; width: 1.2em; text-align: center; font-weight: 700; }
  .mark.healthy { color: var(--ok); } .mark.healthy::before { content: "✓"; }
  .mark.updating { color: var(--accent); } .mark.updating::before { content: "↻"; }
  .mark.failing { color: var(--bad); } .mark.failing::before { content: "✕"; }
  .mark.suspended { color: var(--warn); } .mark.suspended::before { content: "‖"; }
  .mark.warn { color: var(--warn); } .mark.warn::before { content: "!"; }
  .mark.unknown { color: var(--warn); } .mark.unknown::before { content: "?"; }
  .mark.stopped { color: var(--muted); } .mark.stopped::before { content: "■"; }
  .state.unknown { color: var(--warn); } .state.stopped { color: var(--muted); }
  .state.failing { color: var(--bad); } .state.suspended { color: var(--warn); }
  .crumbs { color: var(--muted); font-size: 13px; margin: 0; }
  .hash { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; }
  ul.items { list-style: none; padding: 0; margin: 0 0 8px; }
  ul.items li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.items li:last-child { border-bottom: 0; }
  details.section { margin: 0 0 8px; }
  details.section > summary { cursor: pointer; padding: 6px 0; }
  details.section > summary h2, details.section > summary h3 { display: inline; margin: 0; }
  table.compact td, table.compact th { padding: 6px 10px; }
  table.units { table-layout: fixed; }
  table.units th:nth-child(1) { width: 32%; } table.units th:nth-child(2) { width: 24%; } table.units th:nth-child(3) { width: 12%; }
  h1.mono { font-size: 20px; }
  .action-row { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .action-row form { flex: none; width: 10em; }
  .action-row button { width: 100%; }
  .action-row:last-child { border-bottom: 0; }
  /* Apps list and app page. */
  table.apps td { vertical-align: top; }
  table.apps th:first-child { width: 22%; }
  .hint-line { font-size: 13px; margin: 2px 0 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 8px; }
  .toolbar form { margin: 0; }
  .toolbar button, .toolbar .button { font-size: 14px; padding: 4px 12px; }
  details.disclose { border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; background: var(--panel); }
  details.disclose[open] { padding-bottom: 12px; }
  details.disclose form.wizard { border: 0; padding: 8px 0 0; background: none; }
  section.danger { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 8px; }
  section.danger h2 { color: var(--bad); }
  pre { background: var(--panel); border: 1px solid var(--line); padding: 12px; overflow-x: auto;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">swhurl console</a>
  <nav aria-label="Main">
    <a href="/" class="{{ 'here' if path == '/' }}">Overview</a>
    <a href="/apps" class="{{ 'here' if path.startswith('/apps') }}">Apps</a>
    <a href="/platform" class="{{ 'here' if path.startswith('/platform') or path.startswith('/units') }}">Platform</a>
    <a href="/activity" class="{{ 'here' if path.startswith('/activity') or path.startswith('/jobs') }}">Activity{% if running_jobs %} <span class="badge" title="Jobs running now">{{ running_jobs | length }} running</span>{% endif %}</a>
  </nav>
  <a class="button primary" href="/new">+ New app</a>
  <span class="who">{{ identity }} · Updated {{ read_at }} · <a href="{{ path }}" title="Read the cluster again">↻ Refresh</a></span>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
