<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Console{% endblock %} · swhurl</title>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e2e2dc;
    --ok: #1f7a4d; --bad: #b3261e; --warn: #8a5a00; --off: #6b6b66; --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecece8; --muted: #9a9a93; --line: #33332f;
      --ok: #5cc98f; --bad: #ff8a80; --warn: #e0b04f; --off: #9a9a93; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header strong { font-size: 16px; }
  nav a { margin-right: 16px; color: var(--muted); text-decoration: none; }
  nav a.here { color: var(--text); font-weight: 600; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .off { color: var(--off); }
  .muted { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .columns { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .column { min-width: 210px; flex: 1; }
  .column h2 { margin-top: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--off);
          border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .card.ok { border-left-color: var(--ok); color: inherit; }
  .card.bad { border-left-color: var(--bad); color: inherit; }
  .card.off { border-left-color: var(--warn); color: inherit; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; background: var(--panel);
       border: 1px solid var(--line); padding: 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  form.actions { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-size: 13px; padding: 2px 10px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.risky { color: var(--warn); }
  form.new { display: grid; grid-template-columns: max-content minmax(0, 28em); gap: 8px 16px; align-items: center;
             background: var(--panel); border: 1px solid var(--line); padding: 16px; }
  form.new input, form.new select { font: inherit; padding: 4px 6px; border: 1px solid var(--line);
             border-radius: 4px; background: var(--bg); color: var(--text); width: 100%; }
  form.new .hint { grid-column: 2; margin-top: -6px; }
  @media (max-width: 600px) { form.new { grid-template-columns: 1fr; } form.new .hint { grid-column: 1; } }
  pre { background: var(--panel); border: 1px solid var(--line); padding: 12px; overflow-x: auto;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <strong>swhurl console</strong>
  <nav>
    <a href="/" class="{{ 'here' if path == '/' or path.startswith('/apps') }}">Apps</a>
    <a href="/units" class="{{ 'here' if path == '/units' }}">Flux units</a>
    <a href="/platform" class="{{ 'here' if path == '/platform' }}">Platform</a>
    <a href="/jobs" class="{{ 'here' if path.startswith('/jobs') }}">Jobs</a>
    <a href="/new" class="{{ 'here' if path == '/new' }}">New app</a>
  </nav>
  <span class="who">{{ identity }} · read at {{ read_at }} · <a href="{{ path }}">refresh</a></span>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
