# What the incident reviewer may look at, how often it may call the model and where a fix may
# go (docs/plan.md section 14, "Allowlist"). Changing this file is a reviewed commit: nothing
# at run time can extend it, and the loader refuses any key, app or signal it does not know.
version: 1
model: gpt-6-luna             # also CODEX_MODEL on the analyse container; recorded with every analysis
defaults:
  confidence_min: 0.7         # below this the diagnosis is recorded and no message is sent
  cooldown_hours: 24          # no second model call for the same fingerprint inside this
  max_analyses_per_day: 4     # across all apps
  baseline_hours: 24          # hourly counts kept per app/env/signal
  rate_ratio: 2               # fires when count > rate_ratio * mean(baseline) ...
  rate_min_count: 5           # ... and count >= rate_min_count
  incident_retention_days: 30 # incidents not seen for this long are pruned from state
  run_cost_cents: 50          # charged per model call when the CLI reports no usage
  monthly_refuse_cents: 1600  # refuse new model calls at $16 of the $20 project cap
apps:
  - app: hello-ts
    repository: samclement/hello-ts
    environments: [staging]   # the namespace is <app>-<env>
    expected_service: hello-ts
    signals: [error-logs, error-spans, unexpected-service, missing-telemetry]
    severity: {error-logs: default, error-spans: default, unexpected-service: low, missing-telemetry: high}
    patch_paths: [src/, test/, README.md]
    checks: []                # stage 3: the only commands the verifier may run
alert_rules: []               # {app, signal, rule}: ClickStack rules the operator has written
