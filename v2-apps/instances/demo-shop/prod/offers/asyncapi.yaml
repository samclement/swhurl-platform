# The events demo-shop publishes, as an AsyncAPI document (https://www.asyncapi.com/docs).
# This file is the declaration: the platform reads it to show other apps what they can subscribe
# to, and src/events.ts refuses to publish an event that is not here or a payload that does not
# fit its schema. To add an event: a channel (its address is the event's name), a message with a
# payload schema and an example, and a send operation. An app that publishes nothing keeps this file
# with its channels, operations and components removed, or as `channels: {}`.
asyncapi: 3.0.0
info:
  title: demo-shop
  version: 0.1.0
  description: "Demo: the shop people open; it places orders by calling demo-orders with a platform token"
channels:
  visited:
    address: visited
    description: Someone asked demo-shop for its example route.
    messages:
      visited:
        $ref: '#/components/messages/visited'
operations:
  publishVisited:
    action: send
    channel:
      $ref: '#/channels/visited'
components:
  messages:
    visited:
      summary: One request to the example route
      payload:
        type: object
        required: [path, caller]
        additionalProperties: false
        properties:
          path:
            type: string
            description: The path that was asked for
          caller:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                enum: [app, user, anonymous]
              id:
                type: [string, 'null']
                description: The calling app's name or the person's email
              user:
                type: string
                description: For an app, the signed-in person it is calling for
      examples:
        - payload:
            path: /
            caller: {type: user, id: sam@example.com}
