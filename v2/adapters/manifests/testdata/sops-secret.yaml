# A synthetic SOPS Secret, shaped as `sops --encrypt` writes one here: no real ciphertext or recipient. Not named
# *.sops.yaml, so make check-secrets does not try to decrypt it.
apiVersion: v1
kind: Secret
metadata:
    name: example
    namespace: example
type: Opaque
stringData:
    address: ENC[AES256_GCM,data:c3ludGhldGlj,iv:aXY=,tag:dGFn,type:str]
sops:
    age:
        - recipient: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            c3ludGhldGlj
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-11-08T00:00:00Z"
    mac: ENC[AES256_GCM,data:bWFj,iv:aXY=,tag:dGFn,type:str]
    encrypted_regex: ^(data|stringData)$
    version: 3.12.1
